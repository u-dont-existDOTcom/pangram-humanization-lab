name: Pangram API key probe

on:
  push:
    branches:
      - codex/pangram-key-probe-20260819
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check secret normalization safely
        shell: bash
        env:
          PANGRAM_API_KEY: ${{ secrets.PANGRAM_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          key = os.environ['PANGRAM_API_KEY']
          print('KEY_NONEMPTY=', bool(key))
          print('HAS_EDGE_WHITESPACE=', key != key.strip())
          print('KEY_LENGTH=', len(key))
          print('TRIMMED_LENGTH=', len(key.strip()))
          PY

      - name: Probe documented V3 auth without detection
        shell: bash
        env:
          PANGRAM_API_KEY: ${{ secrets.PANGRAM_API_KEY }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /tmp/pangram-v3-probe.json --write-out '%{http_code}' \
            --request POST 'https://text.api.pangram.com/v3' \
            --header 'Content-Type: application/json' \
            --header "x-api-key: $PANGRAM_API_KEY" \
            --data '{}')"
          echo "PANGRAM_V3_PROBE_HTTP=$code"
          cat /tmp/pangram-v3-probe.json
          test "$code" = "400"
