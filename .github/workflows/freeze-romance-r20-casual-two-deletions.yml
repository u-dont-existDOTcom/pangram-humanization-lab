name: Freeze Romance r20 Casual two deletions

on:
  push:
    branches:
      - automation/pangram-fixed-batch
    paths:
      - '.github/workflows/freeze-romance-r20-casual-two-deletions.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: automation/pangram-fixed-batch
          fetch-depth: 0

      - name: Apply exact two-deletion Casual edit to Part 1
        shell: bash
        run: |
          set -euo pipefail
          SRC='state/candidates/romance-detector-repair-20260820-preservation-r19-owner-final-talk-part1.txt'
          echo 'ca42804f9774e66423caba07be4db4123a80ecb0b61e7a75d1ae2db271a8b9f5  '"$SRC" | sha256sum -c -

          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          src_path = Path('state/candidates/romance-detector-repair-20260820-preservation-r19-owner-final-talk-part1.txt')
          source = src_path.read_text(encoding='utf-8')

          delete1 = 'Oxytocin, vasopressin, and the rest can start attaching you anyway. '
          delete2 = 'You can both mean it when you say this is only sex and still have one of you get attached afterward. '
          for label, needle in [('delete1', delete1), ('delete2', delete2)]:
              count = source.count(needle)
              if count != 1:
                  raise SystemExit(f'{label} expected exactly once, found {count}')

          text = source.replace(delete1, '', 1).replace(delete2, '', 1)

          required = [
              'Your body doesn’t know that you picked someone up at a bar and agreed it was only for fun. Then the next morning, you’re wondering why they didn’t call.',
              'The STI part is easy: say what you know, or say you don’t know. Feelings aren’t. If you’re both really numb or robotic about sex, maybe not.',
              'Outside a loving poly community or tribe, I think honest casual sex is almost impossible.',
              'Affection and the simmer',
              'Can Casual Sex or a Situationship Actually Be Honest?',
              'Which is true, I really was the one they asked about almost every medical, mental-health, and practical problem:'
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'protected anchors missing: {missing}')
          if delete1.strip() in text or delete2.strip() in text:
              raise SystemExit('authorized deletion survived')

          out = Path('state/candidates/romance-detector-repair-20260820-preservation-r20-casual-two-deletions-part1.txt')
          out.write_text(text, encoding='utf-8')

          freeze = {
              'schema_version': 1,
              'candidate_id': 'romance-detector-repair-20260820-r20-casual-two-deletions',
              'source': {
                  'path': str(src_path),
                  'sha256': hashlib.sha256(source.encode()).hexdigest(),
                  'word_count_whitespace': len(source.split()),
              },
              'candidate': {
                  'path': str(out),
                  'sha256': hashlib.sha256(text.encode()).hexdigest(),
                  'word_count_whitespace': len(text.split()),
                  'part2_sha256': '9e4c6a522c95741c7dfc9e040b2dcc40773427cbc0aef8f45211de77208b0c85',
                  'part2_exact_prior_human': 1.0,
              },
              'operations': [
                  {
                      'type': 'owner-deleted',
                      'text_sha256': hashlib.sha256(delete1.strip().encode()).hexdigest(),
                      'word_count': len(delete1.split()),
                  },
                  {
                      'type': 'duplicate-function-consolidation',
                      'text_sha256': hashlib.sha256(delete2.strip().encode()).hexdigest(),
                      'word_count': len(delete2.split()),
                  }
              ],
              'unexplained_deltas': 0,
              'detector_plan': 'After joel-articles final preservation receipt binds this exact candidate, measure aggregate Part 1 only. Reuse exact prior 100%-Human Part 2; no local Casual call.'
          }
          Path('state/experiments/romance-detector-repair-20260820-preservation-r20-casual-two-deletions-freeze.json').write_text(
              json.dumps(freeze, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(freeze, ensure_ascii=False, indent=2))
          PY

      - name: Commit frozen r20 candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            state/candidates/romance-detector-repair-20260820-preservation-r20-casual-two-deletions-part1.txt \
            state/experiments/romance-detector-repair-20260820-preservation-r20-casual-two-deletions-freeze.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze Romance r20 Casual two-deletion candidate'
          git push origin HEAD:automation/pangram-fixed-batch
