name: Freeze Romance owner-integrated r2 aggregate

on:
  push:
    branches:
      - automation/pangram-fixed-batch
    paths:
      - '.github/workflows/freeze-romance-owner-integrated-r2-aggregate.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: automation/pangram-fixed-batch
      - name: Fetch exact reader-visible Part 2 and freeze aggregate spec
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/u-dont-existDOTcom/joel-articles/87aad7cd298126701edc4c26e7b855c7f122a311/work/romance-detector-repair-20260820/materialized-owner-integrated-r2/candidate-part-2.txt'
          curl --fail --silent --show-error --location "$URL" -o /tmp/part2.txt
          echo '20301b1bfb0052de694657411f231f82d9a45ae62ff9c4839015befce5c57dc2  /tmp/part2.txt' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          text = Path('/tmp/part2.txt').read_text(encoding='utf-8')
          spec = {
              'format': 'pangram-fixed-batch-v1',
              'experiment_id': 'romance-detector-repair-20260820-part2-owner-integrated-r2-20260821',
              'audit_id': 'romance-detector-repair-20260820',
              'variants': [{
                  'id': 'OWNER_INTEGRATED_R2',
                  'section_id': 'part2',
                  'budget_scope': 'aggregate',
                  'text': text,
              }],
          }
          Path('experiments/romance-detector-repair-20260820-part2-owner-integrated-r2-20260821.json').write_text(
              json.dumps(spec, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Commit exact spec
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/romance-detector-repair-20260820-part2-owner-integrated-r2-20260821.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze Romance owner-integrated r2 aggregate spec'
          git push origin HEAD:automation/pangram-fixed-batch
