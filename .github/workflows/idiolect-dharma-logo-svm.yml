name: Idiolect Dharma LOGO SVM pilot

on:
  pull_request:
    paths:
      - .github/workflows/idiolect-dharma-logo-svm.yml
      - state/IDIOLECT-DHARMA-LOGO-SVM-SPEC-2026-08-18.json
      - state/IDIOLECT-DHARMA-CLOSED-SET-PILOT-QUEUE-2026-08-18.json
      - src/pangram_lab/dharma_logo_svm.py
      - src/pangram_lab/dharma_speaker_acquire.py
      - src/pangram_lab/surface_svm_pilot.py
      - tests/test_dharma_logo_svm.py
      - tests/test_dharma_speaker_acquire.py
      - tests/test_surface_svm_pilot.py
  push:
    branches: [main]
    paths:
      - .github/workflows/idiolect-dharma-logo-svm.yml
      - state/IDIOLECT-DHARMA-LOGO-SVM-SPEC-2026-08-18.json
      - state/IDIOLECT-DHARMA-CLOSED-SET-PILOT-QUEUE-2026-08-18.json
      - src/pangram_lab/dharma_logo_svm.py
      - src/pangram_lab/dharma_speaker_acquire.py
      - src/pangram_lab/surface_svm_pilot.py
      - tests/test_dharma_logo_svm.py
      - tests/test_dharma_speaker_acquire.py
      - tests/test_surface_svm_pilot.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idiolect-source-network-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install package, tests, and isolated research dependency
        run: |
          python -m pip install -q -e '.[test]'
          python -m pip install -q 'scikit-learn>=1.3,<2'

      - name: Run matched-platform regression tests
        run: |
          python -m pytest -q \
            tests/test_dharma_logo_svm.py \
            tests/test_dharma_speaker_acquire.py \
            tests/test_surface_svm_pilot.py

      - name: Rebuild matched Dharma tranche locally
        run: |
          python -m pangram_lab.dharma_speaker_acquire \
            state/IDIOLECT-DHARMA-CLOSED-SET-PILOT-QUEUE-2026-08-18.json \
            --out-dir .local/idiolect-corpus/dharma-logo-text \
            --manifest-out .local/idiolect-corpus/dharma-logo-manifest.json

      - name: Run matched-platform leave-one-source-group-out pilot
        run: |
          python -m pangram_lab.dharma_logo_svm \
            .local/idiolect-corpus/dharma-logo-manifest.json \
            --spec state/IDIOLECT-DHARMA-LOGO-SVM-SPEC-2026-08-18.json \
            --out .local/idiolect-corpus/dharma-logo-svm-receipt.json

      - name: Enforce metadata-only receipt and fold invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.local/idiolect-corpus/dharma-logo-svm-receipt.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['raw_or_canonical_prose_in_output'] is False
          assert data['pilot_status'] == 'matched-platform-leave-one-source-group-out-original-authorship-pilot-not-IER'
          assert data['source_group_leakage'] is False
          assert data['matched_document_count'] == 10
          assert len(data['matched_source_groups']) == 4
          assert data['fold_count'] == 4
          held = [row['held_out_source_group'] for row in data['fold_design']]
          assert sorted(held) == sorted(data['matched_source_groups'])
          assert len(set(held)) == 4
          for fold in data['fold_design']:
              assert fold['held_out_source_group'] not in fold['training_source_groups']
              assert all(value > 0 for value in fold['train_documents_per_author'].values())
          expected_models = {
              'paper-described-char2-4-word1-2-linear-svm',
              'char2-4-only-sensitivity',
              'word1-2-only-sensitivity',
          }
          assert set(data['models']) == expected_models
          for model in data['models'].values():
              for key in ('accuracy', 'balanced_accuracy', 'macro_f1'):
                  value = float(model[key])
                  assert 0.0 <= value <= 1.0
              assert len(model['folds']) == 4
              assert len(model['predictions']) == 10
              assert model['group_bootstrap_accuracy_95pct']['groups'] == 4
          encoded = path.read_text(encoding='utf-8')
          assert 'local_text_path' not in encoded
          assert 'raw_text' not in encoded
          assert 'canonical_text' not in encoded
          PY

      - name: Upload metadata-only matched-platform receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idiolect-dharma-logo-svm-metadata
          path: .local/idiolect-corpus/dharma-logo-svm-receipt.json
          if-no-files-found: error
          retention-days: 30
