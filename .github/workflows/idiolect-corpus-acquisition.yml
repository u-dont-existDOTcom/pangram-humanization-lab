name: Idiolect corpus acquisition metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/idiolect-corpus-acquisition.yml
      - state/IDIOLECT-LEGACY-TRIAGE-QUEUE-2026-08-18.json
      - src/pangram_lab/corpus_acquire.py
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: idiolect-source-network-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install package and test acquisition boundaries
        run: |
          python -m pip install -q -e '.[test]'
          python -m pytest -q tests/test_corpus_acquire.py

      - name: Acquire diverse legacy triage corpus into ephemeral local storage
        id: acquire
        shell: bash
        run: |
          set +e
          pangram-lab idiolect-corpus-acquire \
            state/IDIOLECT-LEGACY-TRIAGE-QUEUE-2026-08-18.json \
            --out-dir .local/idiolect-corpus/text \
            --manifest-out .local/idiolect-corpus/acquisition-manifest.json
          status=$?
          echo "command_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build and print metadata-only acquisition receipt
        env:
          ACQUISITION_COMMAND_STATUS: ${{ steps.acquire.outputs.command_status }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('.local/idiolect-corpus/acquisition-manifest.json')
          if path.is_file():
              data = json.loads(path.read_text(encoding='utf-8'))
          else:
              data = {
                  'results': [],
                  'errors': [{'sample_id': None, 'error': 'acquisition-manifest-not-created'}],
              }

          results = []
          for row in data.get('results', []):
              row = dict(row)
              row.pop('local_text_path', None)
              results.append(row)

          receipt = {
              'schema_version': 1,
              'source_queue': 'state/IDIOLECT-LEGACY-TRIAGE-QUEUE-2026-08-18.json',
              'selection_status': 'triage-only',
              'raw_or_canonical_prose_in_receipt': False,
              'command_status': int(os.environ.get('ACQUISITION_COMMAND_STATUS', '1')),
              'acquired_count': len(results),
              'error_count': len(data.get('errors', [])),
              'total_words': sum(row.get('word_count', 0) for row in results),
              'results': results,
              'errors': data.get('errors', []),
          }
          out = Path('.local/idiolect-corpus/acquisition-receipt.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          print('BEGIN_IDIOLECT_ACQUISITION_METADATA')
          print(out.read_text(encoding='utf-8'), end='')
          print('END_IDIOLECT_ACQUISITION_METADATA')
          PY

      - name: Upload metadata-only acquisition receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idiolect-corpus-acquisition-metadata
          path: .local/idiolect-corpus/acquisition-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest metadata receipt issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          receipt = Path('.local/idiolect-corpus/acquisition-receipt.json').read_text(encoding='utf-8').rstrip()
          body = (
              'Automated **metadata-only** idiolect corpus acquisition receipt. No raw or canonical Joel prose is included here.\n\n'
              f'Workflow run: {os.environ["RUN_URL"]}\n\n'
              '```json\n' + receipt + '\n```\n'
          )
          Path('/tmp/idiolect-acquisition-issue.md').write_text(body, encoding='utf-8')
          PY

          title='Idiolect corpus acquisition: latest metadata receipt'
          number="$(gh issue list --state all --limit 100 --json number,title --jq '.[] | select(.title == "Idiolect corpus acquisition: latest metadata receipt") | .number' | head -n1)"
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body-file /tmp/idiolect-acquisition-issue.md
          else
            gh issue create --title "$title" --body-file /tmp/idiolect-acquisition-issue.md
          fi

      - name: Verify no acquired prose is tracked
        run: |
          if git status --short --untracked-files=all | grep -v '^?? .local/' | grep -q .; then
            echo 'Acquisition unexpectedly modified repository-visible files.' >&2
            git status --short --untracked-files=all >&2
            exit 1
          fi
          git check-ignore -q .local/idiolect-corpus/acquisition-receipt.json

      - name: Fail if acquisition produced no samples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('.local/idiolect-corpus/acquisition-receipt.json').read_text(encoding='utf-8'))
          if receipt.get('acquired_count', 0) < 1:
              raise SystemExit('no corpus samples were acquired; see the metadata receipt issue for errors')
          PY
