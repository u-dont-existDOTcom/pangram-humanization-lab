name: Idiolect corpus acquisition metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/idiolect-corpus-acquisition.yml
      - state/IDIOLECT-CORPUS-ACQUISITION-QUEUE-2026-08-18.json
      - src/pangram_lab/corpus_acquire.py
      - src/pangram_lab/cli.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idiolect-corpus-acquisition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquire-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install package and test acquisition boundaries
        run: |
          python -m pip install -q -e '.[test]'
          python -m pytest -q tests/test_corpus_acquire.py

      - name: Acquire public legacy corpus into ephemeral local storage
        id: acquire
        shell: bash
        run: |
          set +e
          pangram-lab idiolect-corpus-acquire \
            state/IDIOLECT-CORPUS-ACQUISITION-QUEUE-2026-08-18.json \
            --out-dir .local/idiolect-corpus/text \
            --manifest-out .local/idiolect-corpus/acquisition-manifest.json
          status=$?
          echo "command_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print metadata-only acquisition receipt
        env:
          ACQUISITION_COMMAND_STATUS: ${{ steps.acquire.outputs.command_status }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('.local/idiolect-corpus/acquisition-manifest.json')
          if not path.is_file():
              raise SystemExit('acquisition manifest was not created')

          data = json.loads(path.read_text(encoding='utf-8'))
          results = []
          for row in data.get('results', []):
              row = dict(row)
              row.pop('local_text_path', None)
              results.append(row)

          receipt = {
              'schema_version': 1,
              'source_queue': 'state/IDIOLECT-CORPUS-ACQUISITION-QUEUE-2026-08-18.json',
              'raw_or_canonical_prose_in_receipt': False,
              'command_status': int(os.environ.get('ACQUISITION_COMMAND_STATUS', '1')),
              'acquired_count': len(results),
              'error_count': len(data.get('errors', [])),
              'results': results,
              'errors': data.get('errors', []),
          }
          print('BEGIN_IDIOLECT_ACQUISITION_METADATA')
          print(json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True))
          print('END_IDIOLECT_ACQUISITION_METADATA')

          if not results:
              raise SystemExit('no corpus samples were acquired')
          PY

      - name: Verify no acquired prose is tracked
        run: |
          if git status --short --untracked-files=all | grep -v '^?? .local/' | grep -q .; then
            echo 'Acquisition unexpectedly modified repository-visible files.' >&2
            git status --short --untracked-files=all >&2
            exit 1
          fi
          git check-ignore -q .local/idiolect-corpus/acquisition-manifest.json
