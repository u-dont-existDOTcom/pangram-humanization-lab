name: Idiolect Joel legacy profile freeze

on:
  pull_request:
    paths:
      - .github/workflows/idiolect-joel-legacy-profile-freeze.yml
      - state/IDIOLECT-JOEL-LEGACY-PROFILE-SPEC-2026-08-18.json
      - src/pangram_lab/joel_legacy_profile.py
      - tests/test_joel_legacy_profile.py
      - state/IDIOLECT-LEGACY-TRIAGE-QUEUE-2026-08-18.json
      - src/pangram_lab/corpus_acquire.py
  push:
    branches: [main]
    paths:
      - .github/workflows/idiolect-joel-legacy-profile-freeze.yml
      - state/IDIOLECT-JOEL-LEGACY-PROFILE-SPEC-2026-08-18.json
      - src/pangram_lab/joel_legacy_profile.py
      - tests/test_joel_legacy_profile.py
      - state/IDIOLECT-LEGACY-TRIAGE-QUEUE-2026-08-18.json
      - src/pangram_lab/corpus_acquire.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install package and run cleanup tests
        run: |
          python -m pip install -q -e '.[test]'
          python -m pytest -q tests/test_joel_legacy_profile.py tests/test_corpus_acquire.py

      - name: Build conservative Joel legacy profile locally
        run: |
          python -m pangram_lab.joel_legacy_profile \
            state/IDIOLECT-JOEL-LEGACY-PROFILE-SPEC-2026-08-18.json \
            --receipt-out .local/idiolect-corpus/joel-legacy-profile-receipt.json

      - name: Require six independent nonzero sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('.local/idiolect-corpus/joel-legacy-profile-receipt.json').read_text(encoding='utf-8'))
          if data.get('errors'):
              raise SystemExit(data['errors'])
          if int(data.get('independent_source_count', 0)) != 6:
              raise SystemExit(f"Expected 6 sources, got {data.get('independent_source_count')}")
          if int(data.get('total_words', 0)) < 1000:
              raise SystemExit('Legacy profile unexpectedly under 1000 words')
          if any(int(row.get('profile_word_count', 0)) <= 0 for row in data.get('samples', [])):
              raise SystemExit('At least one profile source is zero-word')
          PY

      - name: Upload metadata-only legacy profile receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idiolect-joel-legacy-profile-metadata
          path: .local/idiolect-corpus/joel-legacy-profile-receipt.json
          if-no-files-found: error
          retention-days: 30
