name: Idiolect surface SVM equal 50-word budget

on:
  pull_request:
    paths:
      - .github/workflows/idiolect-surface-svm-equal-50w.yml
      - state/IDIOLECT-SURFACE-SVM-EQUAL-50W-SPEC-2026-08-18.json
      - src/pangram_lab/surface_svm_equal_budget.py
      - tests/test_surface_svm_equal_budget.py
      - src/pangram_lab/surface_svm_pilot.py
      - src/pangram_lab/surface_svm_matched_cv.py
      - state/IDIOLECT-DHARMA-CLOSED-SET-PILOT-QUEUE-2026-08-18.json
      - state/IDIOLECT-DHARMA-OWNER-CONFIRMED-QUEUE-2026-08-18.json
      - state/IDIOLECT-DHARMA-CONTROL-PROFILE-SPEC-2026-08-18.json
  push:
    branches: [main]
    paths:
      - .github/workflows/idiolect-surface-svm-equal-50w.yml
      - state/IDIOLECT-SURFACE-SVM-EQUAL-50W-SPEC-2026-08-18.json
      - src/pangram_lab/surface_svm_equal_budget.py
      - tests/test_surface_svm_equal_budget.py
      - src/pangram_lab/surface_svm_pilot.py
      - src/pangram_lab/surface_svm_matched_cv.py
      - state/IDIOLECT-DHARMA-CLOSED-SET-PILOT-QUEUE-2026-08-18.json
      - state/IDIOLECT-DHARMA-OWNER-CONFIRMED-QUEUE-2026-08-18.json
      - state/IDIOLECT-DHARMA-CONTROL-PROFILE-SPEC-2026-08-18.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equal-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install package, tests, and isolated research dependency
        run: |
          python -m pip install -q -e '.[test]'
          python -m pip install -q 'scikit-learn>=1.3,<2'

      - name: Run equal-budget regression tests
        run: |
          python -m pytest -q \
            tests/test_surface_svm_equal_budget.py \
            tests/test_surface_svm_matched_cv.py \
            tests/test_surface_svm_pilot.py \
            tests/test_dharma_speaker_acquire.py \
            tests/test_dharma_control_profiles.py

      - name: Rebuild non-overlap Dharma control profiles
        run: |
          python -m pangram_lab.dharma_control_profiles \
            state/IDIOLECT-DHARMA-CONTROL-PROFILE-SPEC-2026-08-18.json \
            --receipt-out .local/idiolect-corpus/dharma-control-profile-receipt.json

      - name: Rebuild matched Dharma author-thread set
        run: |
          python -m pangram_lab.dharma_speaker_acquire \
            state/IDIOLECT-DHARMA-CLOSED-SET-PILOT-QUEUE-2026-08-18.json \
            --out-dir .local/idiolect-corpus/equal50-matched-text \
            --manifest-out .local/idiolect-corpus/equal50-matched-manifest.json

      - name: Rebuild Joel Dharma supplements
        run: |
          python -m pangram_lab.dharma_speaker_acquire \
            state/IDIOLECT-DHARMA-OWNER-CONFIRMED-QUEUE-2026-08-18.json \
            --out-dir .local/idiolect-corpus/equal50-joel-supplement-text \
            --manifest-out .local/idiolect-corpus/equal50-joel-supplement-manifest.json

      - name: Run exact 50-word equal-budget pilot
        run: |
          python -m pangram_lab.surface_svm_equal_budget \
            state/IDIOLECT-SURFACE-SVM-EQUAL-50W-SPEC-2026-08-18.json \
            --matched-manifest .local/idiolect-corpus/equal50-matched-manifest.json \
            --supplement-manifest .local/idiolect-corpus/equal50-joel-supplement-manifest.json \
            --control-manifest .local/idiolect-corpus/dharma-control-profile-acquisition.json \
            --working-dir .local/idiolect-corpus/equal50-normalized \
            --out .local/idiolect-corpus/surface-svm-equal-50w-receipt.json

      - name: Enforce equal-budget invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.local/idiolect-corpus/surface-svm-equal-50w-receipt.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['raw_or_canonical_prose_in_output'] is False
          assert data['pilot_status'] == 'matched-platform-equal-50-word-budget-not-IER'
          assert data['word_budget_per_document'] == 50
          assert data['documents_per_author_per_fold'] == 4
          assert data['training_words_per_author_per_fold'] == 200
          assert data['fold_count'] == 4
          assert data['source_group_leakage'] is False
          assert len(data['aggregate_models']) == 3
          for fold in data['folds']:
              for author in data['authors']:
                  training = fold['training'][author]
                  assert training['document_count'] == 4
                  assert training['normalized_total_words'] == 200
                  assert all(doc['normalized_word_count'] == 50 for doc in training['documents'])
              assert all(doc['normalized_word_count'] == 50 for doc in fold['test_documents'])
          for model in data['aggregate_models'].values():
              assert len(model['predictions']) == 10
              assert model['group_bootstrap_accuracy_95pct']['groups'] == 4
          encoded = path.read_text(encoding='utf-8')
          assert 'local_text_path' not in encoded
          assert 'raw_text' not in encoded
          assert 'canonical_text' not in encoded
          PY

      - name: Upload metadata-only equal-budget receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idiolect-surface-svm-equal-50w
          path: .local/idiolect-corpus/surface-svm-equal-50w-receipt.json
          if-no-files-found: error
          retention-days: 30
