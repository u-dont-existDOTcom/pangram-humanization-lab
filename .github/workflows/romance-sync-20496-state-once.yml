name: Romance sync 20496 state once

on:
  push:
    branches:
      - agent/romance-primal-crucible-gui-repair-20260817
    paths:
      - .github/workflows/romance-sync-20496-state-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Sync exact current-boundary metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          architecture = Path('work/romance-current-assembly/ARCHITECTURE.md')
          text = architecture.read_text(encoding='utf-8')
          replacements = {
              'Current materialized master: `work/romance-current-assembly/current-master.md` SHA-256 `2728c77308698e8f217a5579056ece2526b627c860ed2dafbf33c44ab790d8eb`.':
              'Current materialized master: `work/romance-current-assembly/current-master.md` SHA-256 `2d70fbd7e907e7943e1e38ba6dd723b5efe4feae73a8599bd5f2d17e7a2873d1`.',
              'Current reader-visible boundary SHA-256: `32c2e69a5bc4c3b7760aab27ba690fb19ef5a98d446ed1f02dbbefb739a151cb` (**20,612 words**).':
              'Current reader-visible boundary SHA-256: `10359ab2119ffbe9a8a7a4a52cd0c3216bb1a6a2c0bffbd7e66fca01287f17ce` (**20,496 words**).',
              'Current integrated-source audit: `state/ROMANCE-TOFT-ANAMI-INTEGRATION-COLD-AUDIT-2026-08-17.md`.':
              'Current integrated-source audit: `state/ROMANCE-TOFT-ANAMI-INTEGRATION-COLD-AUDIT-2026-08-17.md`.\nCurrent 20,612 GUI evidence: `state/ROMANCE-PANGRAM-GUI-20612-2026-08-17.md`.\nCurrent safe-repair audit: `state/ROMANCE-PANGRAM-20612-SAFE-REPAIR-2026-08-17.md`.',
              '- The Brad/Pam YouTube object `Li--FKwJu0Q` is a new authorized native object and sits after their self-report, before the section\'s synthesis.':
              '- The Brad/Pam YouTube object `Li--FKwJu0Q` is a new authorized native object and now supplies the stopping point after their self-report, before `Muses & Directors`.',
              'The current **20,612-word** reader-visible boundary has **not** been Pangram tested and must not inherit labels from earlier topology.\n\nCurrent exact halves:\n- Part 1: **10,332 words**, SHA-256 `3e137394f3f1694ba69069f30bfebc9afecb8540a4472e3b5532b8f11de92f54`.\n- Part 2: **10,280 words**, SHA-256 `9016139e285e0246bd5c8fdc4545005a294b0e7dfff79dbe9104df073cb1444d`.\n\nThe last completed manual GUI scan was the older 18,748-word boundary (94.4% Human Part 1; 94.1% Human Part 2). It is historical localization evidence only. The current topology adds approximately 1.9k words and a new native video, so detector localization must start from the new exact hashes.':
              'The exact **20,612-word** reader-visible boundary was tested manually in Pangram 4.0 on Aug. 17, 2026. Part 1 (10,332 words) measured **92.1% Human / 7.9% AI**; Part 2 (10,280 words) measured **90.2% Human / 9.8% AI**. Exact localization and PDF hashes are in `state/ROMANCE-PANGRAM-GUI-20612-2026-08-17.md`.\n\nA safe detector-informed editorial pass then changed only new integration prose where the red window also exposed an independent coherence/overcompletion weakness. Owner-controlled historical red spans were left untouched. Two cold audits are recorded in `state/ROMANCE-PANGRAM-20612-SAFE-REPAIR-2026-08-17.md`.\n\nThe **current 20,496-word candidate is untested** and must not inherit the 20,612 scores. Current exact halves:\n- Part 1: **10,236 words**, SHA-256 `ae88df0f4156537239cb984337196703b88629c3588a5e58ee50c0888d3b39f8`.\n- Part 2: **10,260 words**, SHA-256 `2df878093bc05fefa98ca30e9a97bdd52e212370f432bf0408e90f1b60c54bb0`.',
              'Editorial integration is locked enough for the new exact-boundary detector scan. Run Pangram only against the current 20,612-word hashes after the Browserbase GUI path is live-certified or by manual GUI/PDF if needed. Any detector repair must begin with semantic/architecture review of the exact localized span rather than stylistic rewriting by default.':
              'Retest only the exact current 20,496-word halves. If remaining red is concentrated in owner-controlled historical spans, stop for an owner decision before rewriting them merely for detector compliance. Any further detector repair must re-run article-wide semantic/architecture checks first.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Architecture anchor not found: {old[:100]}')
              text = text.replace(old, new, 1)
          architecture.write_text(text, encoding='utf-8')

          pool = Path('state/ROMANCE-TOFT-ANAMI-OWNER-SOURCE-POOL-2026-08-17.md')
          p = pool.read_text(encoding='utf-8')
          old = '''## Current article boundary after materialization and cold audit

- source SHA-256: `2728c77308698e8f217a5579056ece2526b627c860ed2dafbf33c44ab790d8eb`
- reader-visible SHA-256: `32c2e69a5bc4c3b7760aab27ba690fb19ef5a98d446ed1f02dbbefb739a151cb`
- reader-visible words: **20,612**
- Part 1: 10,332 words; SHA-256 `3e137394f3f1694ba69069f30bfebc9afecb8540a4472e3b5532b8f11de92f54`
- Part 2: 10,280 words; SHA-256 `9016139e285e0246bd5c8fdc4545005a294b0e7dfff79dbe9104df073cb1444d`

Validation: deterministic materialization passes; full repository test suite passes. The open branch's `Lesson integrity` remains red only at the research-closeout gate, not at tests.

Detector status: not yet tested on this topology. Do not transfer old Pangram labels.'''
          new = '''## Current article boundary after the 20,612 GUI scan and safe repair

Measured parent boundary: 20,612 words; Part 1 = 92.1% Human / 7.9% AI, Part 2 = 90.2% Human / 9.8% AI. Exact evidence: `state/ROMANCE-PANGRAM-GUI-20612-2026-08-17.md`.

Current post-repair candidate:
- source SHA-256: `2d70fbd7e907e7943e1e38ba6dd723b5efe4feae73a8599bd5f2d17e7a2873d1`
- reader-visible SHA-256: `10359ab2119ffbe9a8a7a4a52cd0c3216bb1a6a2c0bffbd7e66fca01287f17ce`
- reader-visible words: **20,496**
- Part 1: 10,236 words; SHA-256 `ae88df0f4156537239cb984337196703b88629c3588a5e58ee50c0888d3b39f8`
- Part 2: 10,260 words; SHA-256 `2df878093bc05fefa98ca30e9a97bdd52e212370f432bf0408e90f1b60c54bb0`

Safe-repair authority: `state/ROMANCE-PANGRAM-20612-SAFE-REPAIR-2026-08-17.md`.

Validation: deterministic materialization and focused assembly/authority/reader-visible tests pass after the final cold-audit repair.

Detector status: **current 20,496-word candidate untested**. Do not transfer the 20,612 scores.'''
          if old not in p:
              raise SystemExit('Source-pool boundary anchor not found')
          pool.write_text(p.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit state sync
        shell: bash
        run: |
          git config user.name "Romance State Sync"
          git config user.email "romance-state-sync@users.noreply.github.com"
          git rm .github/workflows/romance-sync-20496-state-once.yml
          git add work/romance-current-assembly/ARCHITECTURE.md state/ROMANCE-TOFT-ANAMI-OWNER-SOURCE-POOL-2026-08-17.md
          git commit -m "state: sync Romance architecture to 20496 candidate"
          git push origin HEAD:"${GITHUB_REF_NAME}"
