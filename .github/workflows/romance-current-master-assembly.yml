name: Romance current master assembly

on:
  push:
    branches:
      - agent/romance-current-master-assembly-2026-08-15
      - agent/romance-architecture-map-2026-08-16
    paths:
      - scripts/assemble_romance_current.py
      - scripts/render_reader_visible.py
      - tests/test_romance_current_assembly.py
      - tests/test_romance_aug16_authority.py
      - tests/test_reader_visible_romance.py
      - work/romance-current-assembly/baseline.md
      - work/romance-current-assembly/assembly-spec.json
      - work/romance-current-assembly/replacements/**
      - .github/workflows/romance-current-master-assembly.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -q -e '.[test]'

      - name: Verify assembly and visible-boundary tests
        run: |
          python -m pytest \
            tests/test_romance_current_assembly.py \
            tests/test_romance_aug16_authority.py \
            tests/test_reader_visible_romance.py -q

      - name: Materialize exact current master and reader-visible boundary
        run: |
          python scripts/assemble_romance_current.py \
            --baseline work/romance-current-assembly/baseline.md \
            --spec work/romance-current-assembly/assembly-spec.json \
            --output work/romance-current-assembly/current-master.md \
            --manifest work/romance-current-assembly/assembly-manifest.json \
            --diff work/romance-current-assembly/current-master.diff
          python scripts/render_reader_visible.py \
            --input work/romance-current-assembly/current-master.md \
            --output work/romance-current-assembly/reader-visible.txt \
            --manifest work/romance-current-assembly/reader-visible-manifest.json

      - name: Prove deterministic second materialization
        run: |
          sha256sum \
            work/romance-current-assembly/current-master.md \
            work/romance-current-assembly/assembly-manifest.json \
            work/romance-current-assembly/current-master.diff \
            work/romance-current-assembly/reader-visible.txt \
            work/romance-current-assembly/reader-visible-manifest.json > /tmp/first.sha256
          python scripts/assemble_romance_current.py \
            --baseline work/romance-current-assembly/baseline.md \
            --spec work/romance-current-assembly/assembly-spec.json \
            --output work/romance-current-assembly/current-master.md \
            --manifest work/romance-current-assembly/assembly-manifest.json \
            --diff work/romance-current-assembly/current-master.diff
          python scripts/render_reader_visible.py \
            --input work/romance-current-assembly/current-master.md \
            --output work/romance-current-assembly/reader-visible.txt \
            --manifest work/romance-current-assembly/reader-visible-manifest.json
          sha256sum \
            work/romance-current-assembly/current-master.md \
            work/romance-current-assembly/assembly-manifest.json \
            work/romance-current-assembly/current-master.diff \
            work/romance-current-assembly/reader-visible.txt \
            work/romance-current-assembly/reader-visible-manifest.json > /tmp/second.sha256
          diff -u /tmp/first.sha256 /tmp/second.sha256

      - name: Commit only generated artifacts
        run: |
          git config user.name "Romance Assembly Actions"
          git config user.email "romance-assembly-actions@users.noreply.github.com"
          git add \
            work/romance-current-assembly/current-master.md \
            work/romance-current-assembly/assembly-manifest.json \
            work/romance-current-assembly/current-master.diff \
            work/romance-current-assembly/reader-visible.txt \
            work/romance-current-assembly/reader-visible-manifest.json
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git commit -m "state: materialize current Romance master and visible boundary"
          git push origin HEAD:"${GITHUB_REF_NAME}"
