name: Romance current master assembly

on:
  push:
    branches:
      - agent/romance-current-master-assembly-2026-08-15
      - agent/romance-architecture-map-2026-08-16
      - agent/romance-concept-flow-improvement-20260817
      - agent/romance-primal-crucible-gui-repair-20260817
    paths:
      - scripts/assemble_romance_current.py
      - scripts/render_reader_visible.py
      - scripts/render_pangram_halves.py
      - tests/test_romance_current_assembly.py
      - tests/test_romance_aug16_authority.py
      - tests/test_romance_post_pangram_editorial.py
      - tests/test_romance_current_gui_repairs.py
      - tests/test_reader_visible_romance.py
      - tests/test_render_pangram_halves.py
      - work/romance-current-assembly/baseline.md
      - work/romance-current-assembly/assembly-spec.json
      - work/romance-current-assembly/replacements/**
      - .github/workflows/romance-current-master-assembly.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -q -e '.[test]'

      - name: Verify assembly and visible-boundary tests
        run: |
          python -m pytest \
            tests/test_romance_current_assembly.py \
            tests/test_romance_aug16_authority.py \
            tests/test_romance_post_pangram_editorial.py \
            tests/test_romance_current_gui_repairs.py \
            tests/test_reader_visible_romance.py \
            tests/test_render_pangram_halves.py -q

      - name: Materialize exact current master and reader-visible boundary
        run: |
          python scripts/assemble_romance_current.py \
            --baseline work/romance-current-assembly/baseline.md \
            --spec work/romance-current-assembly/assembly-spec.json \
            --output work/romance-current-assembly/current-master.md \
            --manifest work/romance-current-assembly/assembly-manifest.json \
            --diff work/romance-current-assembly/current-master.diff
          python scripts/render_reader_visible.py \
            --input work/romance-current-assembly/current-master.md \
            --output work/romance-current-assembly/reader-visible.txt \
            --manifest work/romance-current-assembly/reader-visible-manifest.json
          python scripts/render_pangram_halves.py \
            --input work/romance-current-assembly/current-master.md \
            --part1 work/romance-current-assembly/pangram-part-1.txt \
            --part2 work/romance-current-assembly/pangram-part-2.txt \
            --manifest work/romance-current-assembly/pangram-halves-manifest.json

      - name: Prove deterministic second materialization
        run: |
          sha256sum \
            work/romance-current-assembly/current-master.md \
            work/romance-current-assembly/assembly-manifest.json \
            work/romance-current-assembly/current-master.diff \
            work/romance-current-assembly/reader-visible.txt \
            work/romance-current-assembly/reader-visible-manifest.json \
            work/romance-current-assembly/pangram-part-1.txt \
            work/romance-current-assembly/pangram-part-2.txt \
            work/romance-current-assembly/pangram-halves-manifest.json > /tmp/first.sha256
          python scripts/assemble_romance_current.py \
            --baseline work/romance-current-assembly/baseline.md \
            --spec work/romance-current-assembly/assembly-spec.json \
            --output work/romance-current-assembly/current-master.md \
            --manifest work/romance-current-assembly/assembly-manifest.json \
            --diff work/romance-current-assembly/current-master.diff
          python scripts/render_reader_visible.py \
            --input work/romance-current-assembly/current-master.md \
            --output work/romance-current-assembly/reader-visible.txt \
            --manifest work/romance-current-assembly/reader-visible-manifest.json
          python scripts/render_pangram_halves.py \
            --input work/romance-current-assembly/current-master.md \
            --part1 work/romance-current-assembly/pangram-part-1.txt \
            --part2 work/romance-current-assembly/pangram-part-2.txt \
            --manifest work/romance-current-assembly/pangram-halves-manifest.json
          sha256sum \
            work/romance-current-assembly/current-master.md \
            work/romance-current-assembly/assembly-manifest.json \
            work/romance-current-assembly/current-master.diff \
            work/romance-current-assembly/reader-visible.txt \
            work/romance-current-assembly/reader-visible-manifest.json \
            work/romance-current-assembly/pangram-part-1.txt \
            work/romance-current-assembly/pangram-part-2.txt \
            work/romance-current-assembly/pangram-halves-manifest.json > /tmp/second.sha256
          diff -u /tmp/first.sha256 /tmp/second.sha256

      - name: Commit only generated artifacts
        run: |
          git config user.name "Romance Assembly Actions"
          git config user.email "romance-assembly-actions@users.noreply.github.com"
          git add \
            work/romance-current-assembly/current-master.md \
            work/romance-current-assembly/assembly-manifest.json \
            work/romance-current-assembly/current-master.diff \
            work/romance-current-assembly/reader-visible.txt \
            work/romance-current-assembly/reader-visible-manifest.json \
            work/romance-current-assembly/pangram-part-1.txt \
            work/romance-current-assembly/pangram-part-2.txt \
            work/romance-current-assembly/pangram-halves-manifest.json
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git commit -m "state: materialize current Romance master and visible boundary"
          git push origin HEAD:"${GITHUB_REF_NAME}"

  pangram-browserbase-current:
    needs: materialize
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}
      EXPECTED_PART1_SHA: ae88df0f4156537239cb984337196703b88629c3588a5e58ee50c0888d3b39f8
      EXPECTED_PART2_SHA: 2df878093bc05fefa98ca30e9a97bdd52e212370f432bf0408e90f1b60c54bb0
    steps:
      - name: Check out current Romance branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          path: romance

      - name: Check out Browserbase tooling branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/pangram-browserbase-gui-automation-20260817
          fetch-depth: 0
          path: browserbase-tooling

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Validate Browserbase secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$BROWSERBASE_API_KEY" ]] || { echo 'Missing BROWSERBASE_API_KEY secret'; exit 2; }
          [[ -n "$BROWSERBASE_CONTEXT_ID" ]] || { echo 'Missing BROWSERBASE_CONTEXT_ID secret'; exit 2; }

      - name: Verify exact current detector hashes
        shell: bash
        run: |
          set -euo pipefail
          p1=$(sha256sum romance/work/romance-current-assembly/pangram-part-1.txt | awk '{print $1}')
          p2=$(sha256sum romance/work/romance-current-assembly/pangram-part-2.txt | awk '{print $1}')
          echo "Part 1: $p1"
          echo "Part 2: $p2"
          [[ "$p1" == "$EXPECTED_PART1_SHA" ]] || { echo 'Part 1 SHA mismatch'; exit 3; }
          [[ "$p2" == "$EXPECTED_PART2_SHA" ]] || { echo 'Part 2 SHA mismatch'; exit 3; }

      - name: Install Browserbase GUI runner
        working-directory: browserbase-tooling
        run: python -m pip install -q -e '.[test,browser]'

      - name: Run Pangram 4 GUI on both exact halves
        working-directory: browserbase-tooling
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pangram_gui_browserbase.py run \
            --input ../romance/work/romance-current-assembly/pangram-part-1.txt \
            --input ../romance/work/romance-current-assembly/pangram-part-2.txt \
            --output-root state/gui-runs

      - name: Commit only new Browserbase Pangram evidence
        working-directory: browserbase-tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pangram GUI Browserbase Actions'
          git config user.email 'pangram-gui-browserbase-actions@users.noreply.github.com'
          git add state/gui-runs/pangram-4 || true
          if git diff --cached --quiet; then
            echo 'No new Browserbase evidence to commit; exact hashes were cached.'
            exit 0
          fi
          changed=$(git diff --cached --name-only)
          if grep -Ev '^state/gui-runs/pangram-4/' <<<"$changed" >/dev/null; then
            echo 'Refusing to commit paths outside state/gui-runs/pangram-4/'
            printf '%s\n' "$changed"
            exit 2
          fi
          git commit -m "evidence: Browserbase Pangram current Romance halves"
          git push origin HEAD:agent/pangram-browserbase-gui-automation-20260817
