name: Idiolect ordinary control speaker census
# actions-cost-class: manual-heavy-research

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idiolect-source-network-${{ github.ref }}
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install package and run focused tests
        run: |
          python -m pip install -q -e '.[test]'
          python -m pytest -q \
            tests/test_dharma_author_discover.py \
            tests/test_dharma_ordinary_control_census.py

      - name: Census all explicit speaker labels in one feed pass
        run: |
          python -m pangram_lab.dharma_ordinary_control_census \
            state/IDIOLECT-ORDINARY-CONTROL-CENSUS-SPEC-2026-08-18.json \
            --out .local/idiolect-corpus/dharma-ordinary-control-census.json \
            --page-size 100 \
            --max-pages 5

      - name: Enforce metadata-only and non-admission boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.local/idiolect-corpus/dharma-ordinary-control-census.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('status') != 'ordinary-control-speaker-census-not-profile-admission':
              raise SystemExit(f"Unexpected status: {data.get('status')}")
          if data.get('raw_or_canonical_prose_in_output') is not False:
              raise SystemExit('Receipt prose/privacy flag is not false')
          if data.get('profile_extraction_authorized') is not False:
              raise SystemExit('Census must not authorize profile extraction')
          if int(data.get('archive_post_count', 0)) <= 0:
              raise SystemExit('Census found no archive posts')
          if int(data.get('speaker_count', 0)) < 3:
              raise SystemExit('Census found implausibly few explicit speakers')
          if int(data.get('active_ordinary_matched_control_count', -1)) != 1:
              raise SystemExit('Expected exactly one active ordinary control before census')
          if int(data.get('additional_ordinary_controls_required', -1)) != 1:
              raise SystemExit('Expected one additional ordinary control requirement')
          if len(str(data.get('feed_snapshot_sha256', ''))) != 64:
              raise SystemExit('Missing feed snapshot hash')
          if len(str(data.get('speaker_census_sha256', ''))) != 64:
              raise SystemExit('Missing speaker census hash')

          encoded = json.dumps(data, ensure_ascii=False, sort_keys=True)
          for forbidden in (
              'local_text_path',
              'raw_text',
              'canonical_text',
              'http://',
              'https://',
          ):
              if forbidden in encoded:
                  raise SystemExit(f'Forbidden receipt content: {forbidden}')
          PY

      - name: Verify census did not modify repository-visible files
        run: |
          if git status --short --untracked-files=all | grep -v '^?? .local/' | grep -q .; then
            echo 'Speaker census unexpectedly modified repository-visible files.' >&2
            git status --short --untracked-files=all >&2
            exit 1
          fi
          git check-ignore -q .local/idiolect-corpus/dharma-ordinary-control-census.json

      - name: Upload metadata-only speaker census
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: idiolect-ordinary-control-speaker-census
          path: .local/idiolect-corpus/dharma-ordinary-control-census.json
          if-no-files-found: error
          retention-days: 30
