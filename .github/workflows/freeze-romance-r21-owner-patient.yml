name: Freeze Romance r21 owner patient Part 1

on:
  push:
    branches:
      - automation/pangram-fixed-batch
    paths:
      - '.github/workflows/freeze-romance-r21-owner-patient.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: automation/pangram-fixed-batch
          fetch-depth: 0

      - name: Freeze exact accepted patient replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          src_path = Path('state/candidates/romance-detector-repair-20260820-preservation-r20-casual-two-deletions-part1.txt')
          source = src_path.read_text(encoding='utf-8')
          expected = '04ea13442d4044ee56733b75771cb62c5cd44ba1b5da1bbb57d637c4f2ec4316'
          actual = hashlib.sha256(source.encode()).hexdigest()
          if actual != expected:
              raise SystemExit(f'r20 Part1 hash mismatch: {actual}')

          old = '''All three women told me at some point that they felt like my patient. Which is true, I really was the one they asked about almost every medical, mental-health, and practical problem:

“I’m sick. What should I take?”

“I’m sad. What should I do?”

Of course I helped. Saying, “I’m not your doctor or therapist,” every time would have been cold. But enough moments become a pattern.'''
          new = '''All three women told me at some point that they felt like my patient, and I couldn't exactly argue with them. They asked me about almost every medical, mental-health, and practical problem:

“I’m sick. What should I take?”

“I’m sad. What should I do?”

I usually had some idea, so of course I answered. But enough moments become a pattern.'''
          if source.count(old) != 1:
              raise SystemExit(f'expected old patient block once, found {source.count(old)}')
          text = source.replace(old, new, 1)

          protected = [
              'The problem is when the role takes over the relationship.',
              'Key at first asked me innocently, "Can you be my guru?"',
              'I also have to admit, I can become condescending when somebody stops taking responsibility for their behavior.',
              'I know what can happen on my side. Helping feels good. Being needed can feel good too.',
              'Affection and the simmer',
              'Can Casual Sex or a Situationship Actually Be Honest?',
              'Gandarussa matters to me.'
          ]
          missing = [x for x in protected if x not in text]
          if missing:
              raise SystemExit(f'protected anchors missing: {missing}')

          out = Path('state/candidates/romance-detector-repair-20260820-preservation-r21-owner-patient-part1.txt')
          out.write_text(text, encoding='utf-8')
          manifest = {
              'schema_version': 1,
              'candidate_id': 'romance-detector-repair-20260820-r21-owner-patient',
              'source': {'path': str(src_path), 'sha256': actual, 'word_count_whitespace': len(source.split())},
              'candidate': {
                  'path': str(out),
                  'sha256': hashlib.sha256(text.encode()).hexdigest(),
                  'word_count_whitespace': len(text.split()),
                  'part2_sha256': '9e4c6a522c95741c7dfc9e040b2dcc40773427cbc0aef8f45211de77208b0c85',
                  'part2_exact_prior_human': 1.0
              },
              'owner_acceptance_repository': 'u-dont-existDOTcom/joel-articles',
              'owner_acceptance_commit': '4c2d6eef27369b5597ff44356ce95c941fb32f6e',
              'operation': {
                  'type': 'owner-accepted-replacement',
                  'old_sha256': hashlib.sha256(old.encode()).hexdigest(),
                  'new_sha256': hashlib.sha256(new.encode()).hexdigest(),
                  'old_word_count': len(old.split()),
                  'new_word_count': len(new.split())
              },
              'unexplained_deltas': 0,
              'detector_plan': 'After final joel-articles preservation receipt binds this exact Part1 identity, aggregate-certify Part 1 once. Reuse exact prior 100%-Human Part 2.'
          }
          Path('state/experiments/romance-detector-repair-20260820-preservation-r21-owner-patient-freeze.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Commit frozen r21 Part 1
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            state/candidates/romance-detector-repair-20260820-preservation-r21-owner-patient-part1.txt \
            state/experiments/romance-detector-repair-20260820-preservation-r21-owner-patient-freeze.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze Romance r21 owner patient Part 1'
          git push origin HEAD:automation/pangram-fixed-batch
