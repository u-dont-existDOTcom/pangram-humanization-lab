name: Prepare Romance owner-integrated aggregate spec

on:
  push:
    branches:
      - automation/pangram-fixed-batch
    paths:
      - '.github/workflows/prepare-romance-owner-integrated-spec.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Pangram evidence branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: automation/pangram-fixed-batch
          fetch-depth: 0

      - name: Check out exact Romance task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: u-dont-existDOTcom/joel-articles
          ref: task/romance-detector-repair-20260820
          path: joel-articles
          persist-credentials: false

      - name: Freeze exact owner-integrated Part-2 aggregate spec
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib

          src = pathlib.Path('joel-articles/work/romance-detector-repair-20260820/materialized-owner-integrated/candidate-part-2.txt')
          expected_sha = '9dc539ca99f8c747ecd5a551f2c72ad476c87671919863d2ad469acf6c6e696f'
          expected_words = 9804
          raw = src.read_bytes()
          actual_sha = hashlib.sha256(raw).hexdigest()
          actual_words = len(raw.decode('utf-8').split())
          if actual_sha != expected_sha:
              raise SystemExit(f'owner-integrated Part-2 SHA mismatch: expected={expected_sha} actual={actual_sha}')
          if actual_words != expected_words:
              raise SystemExit(f'owner-integrated Part-2 word-count mismatch: expected={expected_words} actual={actual_words}')

          experiment_id = 'romance-detector-repair-20260820-part2-owner-integrated-20260821'
          spec = {
              'format': 'pangram-fixed-batch-v1',
              'experiment_id': experiment_id,
              'audit_id': 'romance-detector-repair-20260820',
              'variants': [{
                  'id': 'OWNER_INTEGRATED',
                  'section_id': 'part2',
                  'budget_scope': 'aggregate',
                  'text': raw.decode('utf-8'),
              }],
          }
          out = pathlib.Path(f'experiments/{experiment_id}.json')
          sidecar = pathlib.Path(f'experiments/{experiment_id}.sha256')
          if out.exists() or sidecar.exists():
              raise SystemExit('refusing to overwrite existing immutable owner-integrated spec or sidecar')
          out.write_text(json.dumps(spec, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          sidecar.write_text(f'{digest}  {out.name}\n', encoding='utf-8')
          print('candidate_sha256', actual_sha)
          print('candidate_words', actual_words)
          print('budget_scope aggregate')
          print('spec_sha256', digest)
          PY

      - name: Run fixed-batch budget-scope regressions
        run: |
          python -m pip install -q -e '.[test]'
          python -m pytest -q tests/test_call_budget.py tests/test_call_budget_fixed_batch.py tests/test_call_budget_pangram.py

      - name: Commit immutable spec and checksum
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/romance-detector-repair-20260820-part2-owner-integrated-20260821.json experiments/romance-detector-repair-20260820-part2-owner-integrated-20260821.sha256
          git commit -m 'Freeze Romance owner-integrated aggregate Pangram spec'
          git push origin HEAD:automation/pangram-fixed-batch
