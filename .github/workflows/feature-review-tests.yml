name: Feature review tests
on:
  push:
    branches:
      - feature/lesson-closeout-actions
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q tests/test_review_queue.py tests/test_closeout_request.py tests/test_lesson_closeout.py
