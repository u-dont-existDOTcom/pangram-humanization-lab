name: Apply section-only call-cap documentation correction

on:
  push:
    branches:
      - fix/section-only-cap-docs-20260821
    paths:
      - '.github/workflows/apply-section-only-cap-doc-correction.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/section-only-cap-docs-20260821
          fetch-depth: 0

      - name: Apply exact owner correction to canonical docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docs/CHATGPT-OPERATING-GUIDE.md',
              '**Hard limit: at most 6 new paid Pangram POSTs per section per audit.** A whole-article acceptance boundary counts as its own section. Splitting the same section across new batches, transports, branches, workflows, chats, or retries does not reset its budget.',
              '**Hard limit: at most 6 new paid Pangram POSTs per genuine local repair section per audit.** Whole-article, article-half, and other multi-section aggregate certification boundaries remain fully accounted but are not subject to the six-call section cap. Splitting the same local section across new batches, transports, branches, workflows, chats, or retries does not reset its budget.'
          )
          replace_once(
              'docs/CHATGPT-OPERATING-GUIDE.md',
              'Reaching the paid-call limit creates an **operational suspension**, not completion: stop before a seventh paid POST and request narrow help rather than resetting the audit identity.',
              'Reaching a local repair section’s paid-call limit creates an **operational suspension** for that section, not completion: stop before a seventh section-scoped paid POST and request narrow help rather than resetting the section identity. Aggregate certification calls are governed instead by exact-cache, recovery, version, and decision-value gates.'
          )
          replace_once(
              'docs/CHATGPT-OPERATING-GUIDE.md',
              'Before a seventh paid POST, stop and request narrow help from Joel. Do not silently reset the audit identity or raise the cap. The controlled-research stopping rule never overrides the six-paid-call section cap.',
              'Before a seventh paid POST for the same genuine local repair section, stop and request narrow help from Joel. Do not silently reset the section identity or raise the cap. This six-call guard does not apply to whole-article, half-article, or other multi-section aggregate certification boundaries; those calls still require exact cache/recovery and a decision-changing reason.'
          )

          replace_once(
              'state/WORKING-LESSONS-SUPPLEMENT-2026-08-13-HUMANIZATION-GATE.md',
              'A separate cost-control rule can suspend the repair before either terminal state. Each independently tested section/boundary has a hard budget of at most six **new paid Pangram POSTs per audit**. Cache hits, auth probes, polling GETs, and resuming an already-paid pending task do not count. Ambiguous POST attempts and corrective paid POSTs do count. Before a seventh paid POST for that section, stop, preserve the exact measured state, and ask Joel for narrow help. This is a mandatory operational suspension, not a detector pass or completion. Never invent a new batch, workflow, chat, or audit ID solely to reset the same section’s budget.',
              'A separate cost-control rule can suspend a local repair before either terminal state. Each genuine local repair section has a hard budget of at most six **new paid Pangram POSTs per audit**. Cache hits, auth probes, polling GETs, and resuming an already-paid pending task do not count. Ambiguous POST attempts and corrective paid POSTs do count. Before a seventh paid POST for that same local section, stop, preserve the exact measured state, and ask Joel for narrow help. Whole-article, article-half, and other multi-section aggregate certification boundaries remain fully accounted but are not subject to this section cap. Never invent a new batch, workflow, chat, or section identity solely to reset the same local section’s budget.'
          )

          replace_once(
              'state/LESSON-INDEX.md',
              'The hard budget is six new paid Pangram POSTs per independently tested section per audit. Cache hits, auth probes, polling, and pending-task resumes are free for budget purposes. Before a seventh paid POST, stop and request narrow help from Joel; do not reset the budget by inventing a new batch, chat, or audit ID.',
              'The hard budget is six new paid Pangram POSTs per genuine local repair section per audit. Cache hits, auth probes, polling, and pending-task resumes are free for budget purposes. Whole-article, article-half, and other multi-section aggregate certification boundaries are accounted but are not subject to the six-call section cap. Before a seventh paid POST for the same local section, stop and request narrow help from Joel; do not reset the budget by inventing a new batch, chat, audit, or section identity.'
          )
          PY

      - name: Remove one-shot workflow and commit docs only
        run: |
          git rm .github/workflows/apply-section-only-cap-doc-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CHATGPT-OPERATING-GUIDE.md state/WORKING-LESSONS-SUPPLEMENT-2026-08-13-HUMANIZATION-GATE.md state/LESSON-INDEX.md
          git diff --cached --check
          git commit -m 'Correct Pangram call cap to local sections only'
          git push origin HEAD:fix/section-only-cap-docs-20260821
