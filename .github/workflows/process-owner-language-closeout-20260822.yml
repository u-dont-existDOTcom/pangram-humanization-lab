name: Process owner-language closeout 20260822

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/process-owner-language-closeout-20260822.yml'

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -q -e '.[test]'
      - name: Process pending closeout requests
        run: PYTHONPATH=src python -m pangram_lab.request_cli
      - name: Commit processed lesson state
        shell: bash
        run: |
          git config user.name 'Lesson Integrity Actions'
          git config user.email 'lesson-integrity-actions@users.noreply.github.com'
          git add state/LESSON-LEDGER.json state/LESSON-INDEX.md state/WORKING-LESSONS*.md state/lesson-closeout-requests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'lessons: process owner-language context correction'
          git push origin HEAD:main
