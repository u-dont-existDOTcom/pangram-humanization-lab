name: Freeze Romance r19 owner-final Talk

on:
  push:
    branches:
      - automation/pangram-fixed-batch
    paths:
      - '.github/workflows/freeze-romance-r19-owner-final-talk.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: automation/pangram-fixed-batch
          fetch-depth: 0

      - name: Materialize exact owner-final Talk tail
        shell: bash
        run: |
          set -euo pipefail
          SRC='state/candidates/romance-detector-repair-20260820-preservation-r18-owner-talk-dedup-part1.txt'
          echo '093289ce0cb3bdd216ae8e1fd584d4a0b426984a4c2edca97ba3ed75fed36ac9  '"$SRC" | sha256sum -c -

          OWNER_URL='https://raw.githubusercontent.com/u-dont-existDOTcom/joel-articles/27440f8f6641c31a4333b6646aa66d806514844a/work/romance-detector-repair-20260820/recovery-20260822/OWNER-TALK-FINAL-TAIL-20260822.md'
          curl --fail --silent --show-error --location "$OWNER_URL" -o /tmp/owner-talk-final.md

          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          src_path = Path('state/candidates/romance-detector-repair-20260820-preservation-r18-owner-talk-dedup-part1.txt')
          source = src_path.read_text(encoding='utf-8')
          owner_md = Path('/tmp/owner-talk-final.md').read_text(encoding='utf-8')

          marker1 = '## Verbatim owner wording\n\n'
          marker2 = '\n\n## Provenance / supersession guard'
          if owner_md.count(marker1) != 1 or owner_md.count(marker2) != 1:
              raise SystemExit('owner-source markers not unique')
          owner_markdown = owner_md.split(marker1, 1)[1].split(marker2, 1)[0]
          owner_visible = owner_markdown.replace('*or*', 'or').replace('  \n', '\n')

          bridge = 'That conversation is already part of making love.\n\n'
          if source.count(bridge) != 1:
              raise SystemExit(f'expected one standalone bridge, found {source.count(bridge)}')
          text = source.replace(bridge, '', 1)

          start_anchor = "It's important to talk about sexual compatibility before getting undressed, even if that kills the vibe."
          end_anchor = '\n\nAffection and the simmer\n\n'
          if text.count(start_anchor) != 1:
              raise SystemExit(f'expected one Talk-tail start, found {text.count(start_anchor)}')
          start = text.index(start_anchor)
          end = text.find(end_anchor, start)
          if end < 0:
              raise SystemExit('Talk-tail end anchor not found')
          old_tail = text[start:end]
          text = text[:start] + owner_visible + text[end:]

          must_survive = [
              "What I eventually took from my dad's advice was a bigger question: would we like to raise children together? Are we ready?",
              "What do you actually want? You may know some of it and not the rest.",
              "You may not know all the answers yet. “I don’t know, but I’m willing to find out honestly with you” is a perfectly good answer.",
              "And what is sex for each of you? One person may mainly think of bonding while the other thinks of play.",
              "It doesn’t have to mean the same thing every time.",
              'Affection and the simmer',
              'Can Casual Sex or a Situationship Actually Be Honest?',
              "Which is true, I really was the one they asked about almost every medical, mental-health, and practical problem:",
          ]
          missing = [x for x in must_survive if x not in text]
          if missing:
              raise SystemExit(f'protected anchors missing: {missing}')

          owner_required = [
              "Or even especially if it does kill the vibe, actually, since that's a red flag if talking ruins things.",
              "And this applies whether you're leaning to libertine or too traditional.",
              "And once you are undressed, the communication doesn't stop there either.",
              'It\'s that psychological trust & intimacy that builds the bridge between "having sex" and "making love."',
              "I remember reading a Christian magazine's letter from a newlywed Christian woman",
              "I had a relationship with E. that was a bit like that about 15yrs ago.",
              "communication should remain open beyond a simple interview.",
          ]
          missing_owner = [x for x in owner_required if x not in text]
          if missing_owner:
              raise SystemExit(f'owner-final anchors missing: {missing_owner}')

          forbidden_old = [
              'That conversation is already part of making love.',
              "And can you actually say all that once you're naked?",
              'Bodies fitting is not enough.',
              'This will naturally prevent sex from happening too soon',
              "If we can't, that's a red flag for the relationship's chances of success.",
          ]
          survived = [x for x in forbidden_old if x in text]
          if survived:
              raise SystemExit(f'superseded Talk prose survived: {survived}')

          out = Path('state/candidates/romance-detector-repair-20260820-preservation-r19-owner-final-talk-part1.txt')
          out.write_text(text, encoding='utf-8')

          freeze = {
              'schema_version': 1,
              'candidate_id': 'romance-detector-repair-20260820-preservation-r19-owner-final-talk-tail',
              'source': {
                  'path': str(src_path),
                  'sha256': hashlib.sha256(source.encode()).hexdigest(),
                  'word_count_whitespace': len(source.split()),
              },
              'owner_source': {
                  'repository': 'u-dont-existDOTcom/joel-articles',
                  'commit': '27440f8f6641c31a4333b6646aa66d806514844a',
                  'path': 'work/romance-detector-repair-20260820/recovery-20260822/OWNER-TALK-FINAL-TAIL-20260822.md',
                  'markdown_sha256': hashlib.sha256(owner_markdown.encode()).hexdigest(),
                  'visible_sha256': hashlib.sha256(owner_visible.encode()).hexdigest(),
                  'visible_word_count': len(owner_visible.split()),
              },
              'candidate': {
                  'path': str(out),
                  'sha256': hashlib.sha256(text.encode()).hexdigest(),
                  'word_count_whitespace': len(text.split()),
                  'part2_sha256': '9e4c6a522c95741c7dfc9e040b2dcc40773427cbc0aef8f45211de77208b0c85',
                  'part2_exact_prior_human': 1.0,
              },
              'operations': [
                  {
                      'type': 'duplicate-function-consolidation',
                      'old_sha256': hashlib.sha256(bridge[:-2].encode()).hexdigest(),
                      'old_word_count': len(bridge.split()),
                      'surviving_owner_function': 'psychological trust & intimacy builds the bridge between having sex and making love',
                  },
                  {
                      'type': 'owner-supersession',
                      'old_tail_sha256': hashlib.sha256(old_tail.encode()).hexdigest(),
                      'old_tail_word_count': len(old_tail.split()),
                      'new_visible_sha256': hashlib.sha256(owner_visible.encode()).hexdigest(),
                      'new_visible_word_count': len(owner_visible.split()),
                  },
              ],
              'protected_neighbor_functions_preserved': True,
              'unexplained_deltas': 0,
              'detector_plan': 'After joel-articles preservation proof binds this exact candidate and passes, measure only aggregate Part 1. Reuse exact prior 100%-Human Part 2; no local Talk call.',
          }
          Path('state/experiments/romance-detector-repair-20260820-preservation-r19-owner-final-talk-freeze.json').write_text(
              json.dumps(freeze, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(freeze, ensure_ascii=False, indent=2))
          PY

      - name: Commit frozen r19 candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            state/candidates/romance-detector-repair-20260820-preservation-r19-owner-final-talk-part1.txt \
            state/experiments/romance-detector-repair-20260820-preservation-r19-owner-final-talk-freeze.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze Romance r19 owner-final Talk candidate'
          git push origin HEAD:automation/pangram-fixed-batch
