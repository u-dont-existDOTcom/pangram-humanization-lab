name: One-shot Greg Goode control candidate extraction
# actions-cost-class: one-shot-public-source-research

on:
  pull_request:
    paths:
      - .github/workflows/idiolect-greg-control-candidate-one-shot.yml
      - state/IDIOLECT-GREG-GOODE-CONTROL-EXTRACTION-SPEC-2026-08-19.json
      - src/pangram_lab/dharma_control_candidate.py
      - tests/test_dharma_control_candidate.py

permissions:
  contents: read

concurrency:
  group: idiolect-greg-control-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install package and run focused tests
        run: |
          python -m pip install -q -e '.[test]'
          python -m pytest -q \
            tests/test_dharma_control_candidate.py \
            tests/test_dharma_control_profiles.py \
            tests/test_dharma_speaker_acquire.py \
            tests/test_dharma_author_discover.py

      - name: Run one-pass overlap census and paced candidate extraction
        run: |
          python -m pangram_lab.dharma_control_candidate \
            state/IDIOLECT-GREG-GOODE-CONTROL-EXTRACTION-SPEC-2026-08-19.json \
            --out-dir .local/idiolect-corpus/greg-goode-control-candidate \
            --receipt-out .local/idiolect-corpus/greg-goode-control-candidate-receipt.json

      - name: Enforce metadata-only and non-admission boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.local/idiolect-corpus/greg-goode-control-candidate-receipt.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['status'] == 'candidate-extraction-complete-not-role-admission'
          assert data['raw_or_canonical_prose_in_output'] is False
          assert data['role_activation_ready'] is False
          assert data['manual_identity_and_quotation_review_required'] is True
          assert int(data['discovery']['feed_page_count']) > 0
          assert len(str(data['discovery']['feed_snapshot_sha256'])) == 64
          assert len(str(data['discovery']['target_post_set_sha256'])) == 64
          assert len(str(data['partitions']['partition_identity_sha256'])) == 64

          profile_groups = {
              row['source_group'] for row in data['partitions']['profile']['samples']
          }
          holdout_groups = {
              row['source_group']
              for row in data['partitions']['reserved_holdout']['samples']
          }
          assert not profile_groups & holdout_groups

          encoded = json.dumps(data, ensure_ascii=False, sort_keys=True)
          for forbidden in (
              'local_text_path',
              'raw_text',
              'canonical_text',
              'embedding',
              'embeddings',
          ):
              assert forbidden not in encoded
          PY

      - name: Verify prose remains ignored and local
        run: |
          # `pip install -e` legitimately refreshes tracked egg-info metadata.
          # Restore that generated build metadata before checking whether the
          # extraction itself touched repository-visible files.
          git restore --worktree -- src/pangram_humanization_lab.egg-info || true
          if git status --short --untracked-files=all | grep -v '^?? .local/' | grep -q .; then
            echo 'Candidate extraction unexpectedly modified repository-visible files.' >&2
            git status --short --untracked-files=all >&2
            exit 1
          fi
          git check-ignore -q .local/idiolect-corpus/greg-goode-control-candidate-receipt.json

      - name: Upload metadata-only candidate receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idiolect-greg-goode-control-candidate-metadata
          path: .local/idiolect-corpus/greg-goode-control-candidate-receipt.json
          if-no-files-found: error
          retention-days: 14
