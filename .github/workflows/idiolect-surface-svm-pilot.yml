name: Idiolect surface SVM pilot

on:
  pull_request:
    paths:
      - .github/workflows/idiolect-surface-svm-pilot.yml
      - state/IDIOLECT-SURFACE-SVM-PILOT-SPEC-2026-08-18.json
      - src/pangram_lab/surface_svm_pilot.py
      - tests/test_surface_svm_pilot.py
      - state/IDIOLECT-JOEL-LEGACY-PROFILE-SPEC-2026-08-18.json
      - src/pangram_lab/joel_legacy_profile.py
      - state/IDIOLECT-DHARMA-CONTROL-PROFILE-SPEC-2026-08-18.json
      - src/pangram_lab/dharma_control_profiles.py
      - state/IDIOLECT-DHARMA-CLOSED-SET-PILOT-QUEUE-2026-08-18.json
      - src/pangram_lab/dharma_speaker_acquire.py
  push:
    branches: [main]
    paths:
      - .github/workflows/idiolect-surface-svm-pilot.yml
      - state/IDIOLECT-SURFACE-SVM-PILOT-SPEC-2026-08-18.json
      - src/pangram_lab/surface_svm_pilot.py
      - tests/test_surface_svm_pilot.py
      - state/IDIOLECT-JOEL-LEGACY-PROFILE-SPEC-2026-08-18.json
      - src/pangram_lab/joel_legacy_profile.py
      - state/IDIOLECT-DHARMA-CONTROL-PROFILE-SPEC-2026-08-18.json
      - src/pangram_lab/dharma_control_profiles.py
      - state/IDIOLECT-DHARMA-CLOSED-SET-PILOT-QUEUE-2026-08-18.json
      - src/pangram_lab/dharma_speaker_acquire.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install package, tests, and isolated research dependency
        run: |
          python -m pip install -q -e '.[test]'
          python -m pip install -q 'scikit-learn>=1.3,<2'

      - name: Run pilot and acquisition regression tests
        run: |
          python -m pytest -q \
            tests/test_surface_svm_pilot.py \
            tests/test_joel_legacy_profile.py \
            tests/test_dharma_control_profiles.py \
            tests/test_dharma_speaker_acquire.py

      - name: Rebuild frozen Joel legacy profile locally
        run: |
          python -m pangram_lab.joel_legacy_profile \
            state/IDIOLECT-JOEL-LEGACY-PROFILE-SPEC-2026-08-18.json \
            --receipt-out .local/idiolect-corpus/joel-legacy-profile-receipt.json

      - name: Rebuild non-overlap control profiles locally
        run: |
          python -m pangram_lab.dharma_control_profiles \
            state/IDIOLECT-DHARMA-CONTROL-PROFILE-SPEC-2026-08-18.json \
            --receipt-out .local/idiolect-corpus/dharma-control-profile-receipt.json

      - name: Rebuild matched Dharma held-out tranche locally
        run: |
          python -m pangram_lab.dharma_speaker_acquire \
            state/IDIOLECT-DHARMA-CLOSED-SET-PILOT-QUEUE-2026-08-18.json \
            --out-dir .local/idiolect-corpus/dharma-heldout-text \
            --manifest-out .local/idiolect-corpus/dharma-heldout-manifest.json

      - name: Run closed-set surface authorship pilot
        run: |
          python -m pangram_lab.surface_svm_pilot \
            state/IDIOLECT-SURFACE-SVM-PILOT-SPEC-2026-08-18.json \
            --joel-receipt .local/idiolect-corpus/joel-legacy-profile-receipt.json \
            --control-manifest .local/idiolect-corpus/dharma-control-profile-acquisition.json \
            --test-manifest .local/idiolect-corpus/dharma-heldout-manifest.json \
            --out .local/idiolect-corpus/surface-svm-pilot-receipt.json

      - name: Enforce metadata-only receipt and structural invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.local/idiolect-corpus/surface-svm-pilot-receipt.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['raw_or_canonical_prose_in_output'] is False
          assert data['pilot_status'] == 'closed-set-original-authorship-pilot-not-IER'
          assert data['source_group_leakage'] is False
          assert data['train_documents_per_author'] == 6
          assert len(data['training_documents']) == 18
          assert len(data['held_out_documents']) == 10
          assert len(data['held_out_source_groups']) == 4
          expected_models = {
              'paper-described-char2-4-word1-2-linear-svm',
              'char2-4-only-sensitivity',
              'word1-2-only-sensitivity',
          }
          assert set(data['models']) == expected_models
          for model in data['models'].values():
              for key in ('accuracy', 'balanced_accuracy', 'macro_f1'):
                  value = float(model[key])
                  assert 0.0 <= value <= 1.0
              assert model['group_bootstrap_accuracy_95pct']['groups'] == 4
              assert len(model['predictions']) == 10
          encoded = path.read_text(encoding='utf-8')
          # Receipt should contain identities/metadata, never source prose fields.
          assert 'local_text_path' not in encoded
          assert 'raw_text' not in encoded
          assert 'canonical_text' not in encoded
          PY

      - name: Upload metadata-only surface pilot receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idiolect-surface-svm-pilot-metadata
          path: .local/idiolect-corpus/surface-svm-pilot-receipt.json
          if-no-files-found: error
          retention-days: 30
