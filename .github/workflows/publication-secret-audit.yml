name: Publication secret audit

# The irreversible private-to-public transition completed on 2026-08-19.
# This exhaustive history/hosted-log audit is now archival and intentionally manual-only.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: publication-secret-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out complete branch history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Audit reachable Git and hosted disclosure surfaces for secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/audit-publication-secrets.sh
