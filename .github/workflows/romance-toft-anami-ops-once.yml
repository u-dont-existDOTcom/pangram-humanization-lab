name: Romance Toft Anami one-shot ops

on:
  push:
    branches:
      - agent/romance-primal-crucible-gui-repair-20260817
    paths:
      - .github/workflows/romance-toft-anami-ops-once.yml

permissions:
  contents: write

jobs:
  patch-spec:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Append idempotent assembly operations
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('work/romance-current-assembly/assembly-spec.json')
          spec = json.loads(path.read_text(encoding='utf-8'))
          ops = spec['operations']
          existing = {op['id'] for op in ops}

          additions = [
              {
                  'id': 'toft-anami-anti-ptsd-provider-callback-2026-08-17',
                  'type': 'replace_exact',
                  'old': 'Most of all, she said the magic words: “I would rather be with you in the forest than with any other man in a mansion.”\n\nBest drug I ever had.',
                  'replacement_file': 'replacements/toft-anami-anti-ptsd-provider-callback-2026-08-17.md',
              },
              {
                  'id': 'toft-anami-world-feminine-energy-2026-08-17',
                  'type': 'replace_exact',
                  'old': 'For me, that also means keeping close friends, outside therapy when I need it, a mission of my own, separate interests, some connection to community, and the ability to be alone.',
                  'replacement_file': 'replacements/toft-anami-world-feminine-energy-2026-08-17.md',
              },
              {
                  'id': 'toft-anami-maturity-roleplay-2026-08-17',
                  'type': 'replace_exact',
                  'old': 'While different maturity levels are to be expected to some degree, it can get out of hand at the extremes. What I noticed in all three of my reference relationships, is when one person is always the child and the other is always the therapist, guru, doctor, or dad, then it’s too unequal, and eventually there will be some kind of pendulum swing or backlash. When I became consistently the responsible one, that also made me responsible for everything that went wrong, not to mention the unhealthy clinginess, jealousy, and all the rest which went along with that dynamic.',
                  'replacement_file': 'replacements/toft-anami-maturity-roleplay-2026-08-17.md',
              },
          ]

          changed = False
          for op in additions:
              if op['id'] not in existing:
                  ops.append(op)
                  changed = True

          if changed:
              path.write_text(json.dumps(spec, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Commit spec only
        shell: bash
        run: |
          git config user.name "Romance Assembly Actions"
          git config user.email "romance-assembly-actions@users.noreply.github.com"
          git add work/romance-current-assembly/assembly-spec.json
          if git diff --cached --quiet; then
            echo "Assembly operations already present."
            exit 0
          fi
          git commit -m "article: register Toft Anami assembly operations"
          git push origin HEAD:"${GITHUB_REF_NAME}"
