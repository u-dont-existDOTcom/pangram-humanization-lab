name: Pangram GUI via Browserbase

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref containing pangram-part-1.txt and pangram-part-2.txt
        required: true
        default: agent/romance-primal-crucible-gui-repair-20260817
        type: string
      force:
        description: Repeat already-completed identical SHAs
        required: true
        default: false
        type: boolean
  push:
    branches:
      - agent/pangram-browserbase-gui-automation-20260817
    paths:
      - .github/workflows/pangram-gui-browserbase.yml

permissions:
  contents: write

concurrency:
  group: pangram-gui-browserbase
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}
    steps:
      - name: Check out detector tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Validate required Browserbase secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$BROWSERBASE_API_KEY" ]] || { echo 'Missing BROWSERBASE_API_KEY secret'; exit 2; }
          [[ -n "$BROWSERBASE_CONTEXT_ID" ]] || { echo 'Missing BROWSERBASE_CONTEXT_ID secret'; exit 2; }

      - name: Install GUI runner dependencies
        run: python -m pip install -q -e '.[test,browser]'

      - name: Extract exact detector inputs from source ref
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'agent/romance-primal-crucible-gui-repair-20260817' }}
          EXPECTED_PART1_SHA: ae88df0f4156537239cb984337196703b88629c3588a5e58ee50c0888d3b39f8
          EXPECTED_PART2_SHA: 2df878093bc05fefa98ca30e9a97bdd52e212370f432bf0408e90f1b60c54bb0
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo 'Unsafe source_ref'; exit 2; }
          [[ "$SOURCE_REF" != *..* ]] || { echo 'Unsafe source_ref'; exit 2; }
          git fetch --no-tags origin "+refs/heads/${SOURCE_REF}:refs/remotes/origin/pangram-source" \
            || git fetch --no-tags origin "+refs/tags/${SOURCE_REF}:refs/tags/pangram-source"
          source_commit=$(git rev-parse 'refs/remotes/origin/pangram-source^{commit}' 2>/dev/null \
            || git rev-parse 'refs/tags/pangram-source^{commit}')
          mkdir -p /tmp/pangram-inputs
          git show "${source_commit}:work/romance-current-assembly/pangram-part-1.txt" > /tmp/pangram-inputs/part-1.txt
          git show "${source_commit}:work/romance-current-assembly/pangram-part-2.txt" > /tmp/pangram-inputs/part-2.txt
          p1=$(sha256sum /tmp/pangram-inputs/part-1.txt | awk '{print $1}')
          p2=$(sha256sum /tmp/pangram-inputs/part-2.txt | awk '{print $1}')
          printf 'source_commit=%s\npart1_sha=%s\npart2_sha=%s\n' "$source_commit" "$p1" "$p2"
          [[ "$p1" == "$EXPECTED_PART1_SHA" ]] || { echo "Part 1 SHA mismatch: $p1"; exit 3; }
          [[ "$p2" == "$EXPECTED_PART2_SHA" ]] || { echo "Part 2 SHA mismatch: $p2"; exit 3; }
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_ENV"
          sha256sum /tmp/pangram-inputs/part-1.txt /tmp/pangram-inputs/part-2.txt

      - name: Run Pangram GUI measurements
        env:
          FORCE_RERUN: ${{ inputs.force || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            run
            --input /tmp/pangram-inputs/part-1.txt
            --input /tmp/pangram-inputs/part-2.txt
            --output-root state/gui-runs
          )
          if [[ "$FORCE_RERUN" == 'true' ]]; then
            args+=(--force)
          fi
          python scripts/pangram_gui_browserbase.py "${args[@]}"

      - name: Commit only new Pangram GUI evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pangram GUI Browserbase Actions'
          git config user.email 'pangram-gui-browserbase-actions@users.noreply.github.com'
          git add state/gui-runs/pangram-4 || true
          if git diff --cached --quiet; then
            echo 'No new GUI evidence to commit.'
            exit 0
          fi
          changed=$(git diff --cached --name-only)
          if grep -Ev '^state/gui-runs/pangram-4/' <<<"$changed" >/dev/null; then
            echo 'Refusing to commit paths outside state/gui-runs/pangram-4/'
            printf '%s\n' "$changed"
            exit 2
          fi
          git commit -m "evidence: capture Pangram GUI measurements ${source_commit:0:12}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
