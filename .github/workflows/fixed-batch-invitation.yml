name: Fixed batch invitation
on:
  push:
    branches: [automation/pangram-fixed-batch]
    paths: ['.github/workflows/fixed-batch-invitation.yml','scripts/build_spiritual_bypassing_invitation_batch.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[test]'
      - run: pytest -q tests/test_fixed_batch.py tests/test_pangram.py tests/test_cache.py tests/test_git_sync.py tests/test_result_paths.py
      - run: |
          git config user.name "Pangram Lab Actions"
          git config user.email "pangram-lab-actions@users.noreply.github.com"
      - env: {PANGRAM_API_KEY: '${{ secrets.PANGRAM_API_KEY }}'}
        run: test -n "$PANGRAM_API_KEY"
      - run: python scripts/build_spiritual_bypassing_invitation_batch.py
      - env: {PANGRAM_API_KEY: '${{ secrets.PANGRAM_API_KEY }}'}
        run: python scripts/run_fixed_batch.py /tmp/spiritual-bypassing-visible-boundary-r18-light-signpost-2026-08-14.json --out state/experiments/spiritual-bypassing-visible-boundary-r18-light-signpost-2026-08-14-results.json
