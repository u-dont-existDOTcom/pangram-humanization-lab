name: Idiolect Blogger source discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/idiolect-blogger-discovery.yml
      - state/IDIOLECT-BLOGGER-DISCOVERY-QUEUE-2026-08-18.json
      - src/pangram_lab/blogger_discover.py
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: idiolect-source-network-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install package and test discovery boundaries
        run: |
          python -m pip install -q -e '.[test]'
          python -m pytest -q tests/test_blogger_discover.py

      - name: Discover confirmed-owner Blogger post metadata
        id: discover
        shell: bash
        run: |
          set +e
          pangram-lab idiolect-blogger-discover \
            state/IDIOLECT-BLOGGER-DISCOVERY-QUEUE-2026-08-18.json \
            --out .local/idiolect-corpus/blogger-discovery.json
          status=$?
          echo "command_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build compact discovery receipt
        env:
          DISCOVERY_COMMAND_STATUS: ${{ steps.discover.outputs.command_status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('.local/idiolect-corpus/blogger-discovery.json')
          if path.is_file():
              data = json.loads(path.read_text(encoding='utf-8'))
          else:
              data = {'results': [], 'errors': [{'source_id': None, 'error': 'discovery-output-not-created'}]}

          blogs = []
          for row in data.get('results', []):
              posts = row.get('posts', [])
              published = sorted(p.get('published') for p in posts if p.get('published'))
              blogs.append({
                  'source_id': row.get('source_id'),
                  'blog_root': row.get('blog_root'),
                  'post_count': row.get('post_count', 0),
                  'oldest_published': published[0] if published else None,
                  'newest_published': published[-1] if published else None,
                  'feed_pages': len(row.get('pages', [])),
                  'provenance': row.get('provenance'),
              })

          receipt = {
              'schema_version': 1,
              'content_included': False,
              'command_status': int(os.environ.get('DISCOVERY_COMMAND_STATUS', '1')),
              'run_url': os.environ['RUN_URL'],
              'artifact_name': 'idiolect-blogger-discovery-metadata',
              'artifact_contains_prose': False,
              'blogs_discovered': len(blogs),
              'posts_discovered': sum(b['post_count'] for b in blogs),
              'blogs': blogs,
              'errors': data.get('errors', []),
          }
          out = Path('.local/idiolect-corpus/blogger-discovery-receipt.json')
          out.write_text(json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Upload full metadata-only discovery inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idiolect-blogger-discovery-metadata
          path: .local/idiolect-corpus/blogger-discovery.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest compact discovery receipt issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          receipt = Path('.local/idiolect-corpus/blogger-discovery-receipt.json').read_text(encoding='utf-8').rstrip()
          body = (
              'Automated **metadata-only** Blogger source discovery receipt. No Joel post content is included in this issue or its workflow artifact.\n\n'
              '```json\n' + receipt + '\n```\n'
          )
          Path('/tmp/idiolect-blogger-discovery-issue.md').write_text(body, encoding='utf-8')
          PY

          title='Idiolect Blogger discovery: latest metadata receipt'
          number="$(gh issue list --state all --limit 100 --json number,title --jq '.[] | select(.title == "Idiolect Blogger discovery: latest metadata receipt") | .number' | head -n1)"
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body-file /tmp/idiolect-blogger-discovery-issue.md
          else
            gh issue create --title "$title" --body-file /tmp/idiolect-blogger-discovery-issue.md
          fi

      - name: Verify discovery stored no post content in repository-visible paths
        run: |
          if git status --short --untracked-files=all | grep -v '^?? .local/' | grep -q .; then
            echo 'Discovery unexpectedly modified repository-visible files.' >&2
            git status --short --untracked-files=all >&2
            exit 1
          fi
          git check-ignore -q .local/idiolect-corpus/blogger-discovery.json

      - name: Fail if no metadata was discovered
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('.local/idiolect-corpus/blogger-discovery-receipt.json').read_text(encoding='utf-8'))
          if receipt.get('posts_discovered', 0) < 1:
              raise SystemExit('no Blogger post metadata was discovered; see the receipt issue for errors')
          PY
