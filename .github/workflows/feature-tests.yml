name: Feature tests
on:
  push:
    branches:
      - feature/pangram-section-budget-usage
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: >-
          pytest -q
          tests/test_call_budget.py
          tests/test_call_budget_pangram.py
          tests/test_call_budget_fixed_batch.py
          tests/test_fixed_batch.py
          tests/test_pangram.py
          tests/test_cache.py
          tests/test_git_sync.py
