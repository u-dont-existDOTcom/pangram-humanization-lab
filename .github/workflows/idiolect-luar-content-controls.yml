name: Idiolect LUAR content controls
# actions-cost-class: manual-heavy-research

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install package and isolated CPU research environment
        run: |
          python -m pip install -q -e '.[test]'
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu 'torch>=2.2,<3'
          python -m pip install -q \
            'transformers>=4.40,<5' \
            'einops>=0.7,<1' \
            'safetensors>=0.4,<1' \
            'scikit-learn>=1.3,<2'

      - name: Run transform and LUAR adapter regression tests
        run: |
          python -m pytest -q \
            tests/test_luar_content_controls.py \
            tests/test_luar_matched_pilot.py \
            tests/test_surface_svm_equal_budget.py \
            tests/test_surface_svm_matched_cv.py \
            tests/test_dharma_speaker_acquire.py

      - name: Rebuild required Joel-only Dharma supplements first
        run: |
          python -m pangram_lab.dharma_speaker_acquire \
            state/IDIOLECT-DHARMA-OWNER-CONFIRMED-QUEUE-2026-08-18.json \
            --sample-id dc-2013-06-lucid-dreaming \
            --sample-id dc-2013-06-sound-bahiya \
            --out-dir .local/idiolect-corpus/controls-joel-supplement-text \
            --manifest-out .local/idiolect-corpus/controls-joel-supplement-manifest.json

      - name: Acquire frozen six-source control profiles only
        run: |
          python -m pangram_lab.dharma_speaker_acquire \
            state/IDIOLECT-LUAR-CONTROL-TRAIN-QUEUE-2026-08-18.json \
            --out-dir .local/idiolect-corpus/controls-control-text \
            --manifest-out .local/idiolect-corpus/controls-control-manifest.json

      # The first live control run hit Blogger's rolling limiter on request 25
      # even after the acquire helper's bounded retry. The research design is
      # unchanged; wait past that rolling window before the final matched batch.
      - name: Space Blogger acquisition batches past rolling limit
        run: sleep 65

      - name: Rebuild matched Dharma author-thread set
        run: |
          python -m pangram_lab.dharma_speaker_acquire \
            state/IDIOLECT-DHARMA-CLOSED-SET-PILOT-QUEUE-2026-08-18.json \
            --out-dir .local/idiolect-corpus/controls-matched-text \
            --manifest-out .local/idiolect-corpus/controls-matched-manifest.json

      - name: Run pinned LUAR content controls
        run: |
          python -m pangram_lab.luar_content_controls \
            state/IDIOLECT-LUAR-CONTENT-CONTROLS-SPEC-2026-08-18.json \
            --matched-manifest .local/idiolect-corpus/controls-matched-manifest.json \
            --supplement-manifest .local/idiolect-corpus/controls-joel-supplement-manifest.json \
            --control-manifest .local/idiolect-corpus/controls-control-manifest.json \
            --working-dir .local/idiolect-corpus/luar-content-controls \
            --out .local/idiolect-corpus/luar-content-controls-receipt.json

      - name: Enforce diagnostic, transform, leakage and privacy invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.local/idiolect-corpus/luar-content-controls-receipt.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['pilot_status'] == 'luar-content-controls-diagnostic-not-IER'
          assert data['raw_or_canonical_prose_in_output'] is False
          assert data['embeddings_persisted_in_output'] is False
          assert data['source_group_leakage'] is False
          model = data['model']
          assert model['model_id'] == 'rrivera1849/LUAR-MUD'
          assert model['requested_revision'] == 'e95c2b6e5b03e5e47f4a3e041afa9bde0a50b73d'
          assert model['embedding_size'] in (0, 512)
          assert model['episode_length_for_document_embedding'] == 1
          assert model['embeddings_persisted_in_receipt'] is False

          expected = {
              'whole_document_block_shuffle',
              'equal_50_word_shuffle',
              'whole_document_function_mask',
              'equal_50_word_function_mask',
          }
          assert set(data['conditions']) == expected
          for condition in data['conditions'].values():
              assert condition['fold_count'] == 4
              aggregate = condition['aggregate']
              assert len(aggregate['predictions']) == 10
              assert aggregate['group_bootstrap_accuracy_95pct']['groups'] == 4
              for key in ('accuracy', 'balanced_accuracy', 'macro_f1'):
                  assert 0.0 <= float(aggregate[key]) <= 1.0

          audits = data['transform_audit']
          assert audits
          shuffle = [row for row in audits if row['transform'] == 'shuffle']
          masked = [row for row in audits if row['transform'] == 'function_mask']
          assert shuffle and masked
          assert all(row['token_multiset_preserved'] is True for row in shuffle)
          assert all(row['whitespace_pattern_preserved'] is True for row in shuffle)
          assert all(row['whitespace_token_count_preserved'] is True for row in masked)
          assert all(row['whitespace_pattern_preserved'] is True for row in masked)
          assert sum(row['masked_tokens'] for row in masked) > 0

          forbidden_vector_keys = {
              'embedding', 'embeddings', 'vector', 'vectors',
              'raw_embedding', 'raw_embeddings',
          }
          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      assert key not in forbidden_vector_keys, key
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(data)
          encoded = path.read_text(encoding='utf-8')
          for forbidden in ('local_text_path', 'raw_text', 'canonical_text'):
              assert forbidden not in encoded
          PY

      - name: Upload metadata-only LUAR control receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idiolect-luar-content-controls-metadata
          path: .local/idiolect-corpus/luar-content-controls-receipt.json
          if-no-files-found: error
          retention-days: 30
