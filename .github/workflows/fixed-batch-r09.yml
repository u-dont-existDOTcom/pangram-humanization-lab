name: Fixed batch r09
on:
  push:
    branches: [automation/pangram-fixed-batch]
    paths: ['.github/workflows/fixed-batch-r09.yml','scripts/apply_spiritual_bypassing_r09.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[test]'
      - run: pytest -q tests/test_fixed_batch.py tests/test_pangram.py tests/test_cache.py tests/test_git_sync.py
      - run: |
          git config user.name "Pangram Lab Actions"
          git config user.email "pangram-lab-actions@users.noreply.github.com"
      - env: {PANGRAM_API_KEY: '${{ secrets.PANGRAM_API_KEY }}'}
        run: test -n "$PANGRAM_API_KEY"
      - run: python scripts/apply_spiritual_bypassing_r09.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/spiritual-bypassing-r09.md')
          data={'format':'pangram-fixed-batch-v1','experiment_id':'spiritual-bypassing-r09-2026-08-13','variants':[{'id':'FULL_R09','text':p.read_text(encoding='utf-8')}]}
          Path('/tmp/r09.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - env: {PANGRAM_API_KEY: '${{ secrets.PANGRAM_API_KEY }}'}
        run: python scripts/run_fixed_batch.py /tmp/r09.json --out state/experiments/spiritual-bypassing-r09-2026-08-13-results.json
