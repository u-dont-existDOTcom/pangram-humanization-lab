name: One-shot idiolect-to-Pangram prescreen pilot
# actions-cost-class: one-shot-public-research

on:
  pull_request:
    paths:
      - .github/workflows/idiolect-pangram-prescreen-pilot-one-shot.yml
      - state/PANGRAM-IDIOLECT-PRESCREEN-PILOT-SPEC-2026-08-20.json
      - src/pangram_lab/pangram_idiolect_prescreen.py
      - tests/test_pangram_idiolect_prescreen.py

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install package and run focused tests
        run: |
          python -m pip install -q -e '.[test]'
          python -m pytest -q tests/test_pangram_idiolect_prescreen.py tests/test_idiolect.py

      - name: Acquire relationship-register natural-owner profile without Pangram
        run: |
          python - <<'PY'
          import json
          import shutil
          import time
          from pathlib import Path
          from pangram_lab.corpus_acquire import acquire_inventory

          inventory = Path('state/IDIOLECT-LEGACY-TRIAGE-QUEUE-2026-08-18.json')
          spec = json.loads(Path('state/PANGRAM-IDIOLECT-PRESCREEN-PILOT-SPEC-2026-08-20.json').read_text(encoding='utf-8'))
          ids = list(spec['profile']['sample_ids'])
          profile_dir = Path('.local/idiolect-pangram-prescreen/profile')
          profile_dir.mkdir(parents=True, exist_ok=True)
          receipt = []
          for index, sample_id in enumerate(ids):
              if index:
                  time.sleep(8)
              runtime = acquire_inventory(
                  inventory,
                  out_dir=Path('.local/idiolect-pangram-prescreen/acquired') / sample_id,
                  manifest_out=Path('.local/idiolect-pangram-prescreen/manifests') / f'{sample_id}.json',
                  sample_ids={sample_id},
                  timeout=30,
              )
              if runtime.get('errors') or len(runtime.get('results', [])) != 1:
                  raise SystemExit({'sample_id': sample_id, 'errors': runtime.get('errors')})
              row = runtime['results'][0]
              source = Path(row['local_text_path'])
              target = profile_dir / f'{sample_id}.txt'
              shutil.copyfile(source, target)
              receipt.append({
                  'sample_id': sample_id,
                  'canonical_sha256': row['canonical_sha256'],
                  'word_count': row['word_count'],
                  'quality_flags': row.get('quality_flags', []),
              })
          Path('.local/idiolect-pangram-prescreen/profile-receipt.json').write_text(
              json.dumps({'raw_prose_in_receipt': False, 'samples': receipt}, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Run cached-only prescreen pilot
        run: |
          python -m pangram_lab.pangram_idiolect_prescreen \
            state/PANGRAM-IDIOLECT-PRESCREEN-PILOT-SPEC-2026-08-20.json \
            --profile-dir .local/idiolect-pangram-prescreen/profile \
            --out .local/idiolect-pangram-prescreen/result.json

      - name: Enforce no-substitution overclaim and privacy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.local/idiolect-pangram-prescreen/result.json').read_text(encoding='utf-8'))
          assert data['no_new_pangram_calls'] is True
          assert data['interpretation_guardrails']['no_raw_profile_prose_in_output'] is True
          assert data['validation']['minimum_sample_structure_met'] is False
          assert data['validation']['substitution_validated'] is False
          assert data['status'] == 'pilot-not-validated'
          assert data['dataset']['group_count'] >= 3
          assert data['profile']['sample_count'] == 6
          assert data['profile']['word_count'] >= 1000
          forbidden = {'text', 'raw_text', 'canonical_text', 'local_text_path'}
          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      assert key not in forbidden, key
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(data)
          PY

      - name: Upload metadata-only pilot result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idiolect-pangram-prescreen-pilot-metadata
          path: |
            .local/idiolect-pangram-prescreen/result.json
            .local/idiolect-pangram-prescreen/profile-receipt.json
          if-no-files-found: error
          retention-days: 30
