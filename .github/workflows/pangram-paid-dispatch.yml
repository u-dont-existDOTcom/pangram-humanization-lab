name: Pangram fixed-batch safety gate

on:
  push:
    branches:
      - automation/pangram-fixed-batch
      - 'codex/**'
  pull_request:
    branches:
      - automation/pangram-fixed-batch

permissions:
  contents: read

concurrency:
  group: pangram-fixed-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      paid_request: ${{ steps.preflight.outputs.paid_request }}
      spec_path: ${{ steps.preflight.outputs.spec_path }}
      result_path: ${{ steps.preflight.outputs.result_path }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -q -e '.[test]'
      - name: Run complete deterministic suite
        run: python -m pytest -q
      - name: Audit repository-visible controls
        run: python scripts/audit_codex_github.py --root . --fail-on error
      - name: Validate automatic paid request
        if: github.event_name == 'push'
        id: preflight
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python scripts/validate_paid_push.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  detector:
    if: github.event_name == 'push' && github.ref == 'refs/heads/automation/pangram-fixed-batch' && needs.verify.outputs.paid_request == 'true'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install fixed-batch runner
        run: python -m pip install -q -e '.[test]'
      - name: Configure immutable evidence commits
        run: |
          git config user.name "Pangram Lab Actions"
          git config user.email "pangram-lab-actions@users.noreply.github.com"
      - name: Enable evidence push credential
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          clean: false
      - name: Run hash-bound automatic paid batch
        env:
          PANGRAM_API_KEY: ${{ secrets.PANGRAM_API_KEY }}
          SPEC_PATH: ${{ needs.verify.outputs.spec_path }}
          RESULT_PATH: ${{ needs.verify.outputs.result_path }}
        shell: bash
        run: |
          test -n "$PANGRAM_API_KEY" || { echo "PANGRAM_API_KEY secret is missing"; exit 1; }
          python scripts/run_fixed_batch.py "$SPEC_PATH" --out "$RESULT_PATH"
