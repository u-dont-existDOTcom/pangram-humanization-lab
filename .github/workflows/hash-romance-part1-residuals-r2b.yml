name: Hash Romance Part 1 residual r2b spec

on:
  push:
    branches:
      - automation/pangram-fixed-batch
    paths:
      - '.github/workflows/hash-romance-part1-residuals-r2b.yml'

permissions:
  contents: write

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: automation/pangram-fixed-batch
      - name: Hash exact spec
        shell: bash
        run: |
          sha256sum experiments/romance-detector-repair-20260820-part1-residuals-r2b-20260821.json | awk '{print $1}' > experiments/romance-detector-repair-20260820-part1-residuals-r2b-20260821.json.sha256
      - name: Commit hash
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/romance-detector-repair-20260820-part1-residuals-r2b-20260821.json.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Hash Romance Part 1 residual r2b spec'
          git push origin HEAD:automation/pangram-fixed-batch
