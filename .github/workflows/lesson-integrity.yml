name: Lesson integrity

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pangram-lesson-integrity
  cancel-in-progress: false

jobs:
  process-requests:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -q -e '.[test]'
      - name: Test metadata closeout path
        run: python -m pytest -q tests/test_review_queue.py tests/test_closeout_request.py tests/test_lesson_closeout.py
      - name: Configure git identity
        run: |
          git config user.name "Lesson Integrity Actions"
          git config user.email "lesson-integrity-actions@users.noreply.github.com"
      - name: Process pending metadata requests
        run: PYTHONPATH=src python -m pangram_lab.request_cli
      - name: Commit processed requests to the pull-request branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          git add state/LESSON-LEDGER.json state/LESSON-INDEX.md state/WORKING-LESSONS*.md state/lesson-closeout-requests || true
          if git diff --cached --quiet; then
            echo "No pending metadata requests"
            exit 0
          fi
          git commit -m "lessons: process metadata request"
          git push origin "HEAD:$HEAD_REF"

  change-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -q -e '.[test]'
      - name: Run full test suite
        run: python -m pytest -q
      - name: Determine comparison base
        id: base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              before=$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || git rev-list --max-parents=0 "$GITHUB_SHA" | tail -1)
            fi
            echo "sha=$before" >> "$GITHUB_OUTPUT"
          fi
      - name: Check changed research closeout
        run: PYTHONPATH=src python -m pangram_lab.lesson_closeout check --base "${{ steps.base.outputs.sha }}" --head "$GITHUB_SHA"
      - name: Audit current ref
        run: PYTHONPATH=src python -m pangram_lab.lesson_closeout audit --ref "$GITHUB_SHA"

  browserbase-current-romance:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/romance-primal-crucible-gui-repair-20260817' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}
      EXPECTED_PART1_SHA: ae88df0f4156537239cb984337196703b88629c3588a5e58ee50c0888d3b39f8
      EXPECTED_PART2_SHA: 2df878093bc05fefa98ca30e9a97bdd52e212370f432bf0408e90f1b60c54bb0
    steps:
      - name: Check out exact Romance PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          path: romance

      - name: Check out Browserbase tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/pangram-browserbase-gui-automation-20260817
          fetch-depth: 0
          path: tooling

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Validate secrets and exact input hashes
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$BROWSERBASE_API_KEY" ]] || { echo 'Missing BROWSERBASE_API_KEY secret'; exit 2; }
          [[ -n "$BROWSERBASE_CONTEXT_ID" ]] || { echo 'Missing BROWSERBASE_CONTEXT_ID secret'; exit 2; }
          p1=$(sha256sum romance/work/romance-current-assembly/pangram-part-1.txt | awk '{print $1}')
          p2=$(sha256sum romance/work/romance-current-assembly/pangram-part-2.txt | awk '{print $1}')
          echo "Part 1 SHA: $p1"
          echo "Part 2 SHA: $p2"
          [[ "$p1" == "$EXPECTED_PART1_SHA" ]] || { echo 'Part 1 SHA mismatch'; exit 3; }
          [[ "$p2" == "$EXPECTED_PART2_SHA" ]] || { echo 'Part 2 SHA mismatch'; exit 3; }

      - name: Install Browserbase GUI runner
        working-directory: tooling
        run: python -m pip install -q -e '.[test,browser]'

      - name: Verify persistent Pangram login without submitting
        working-directory: tooling
        run: python scripts/pangram_gui_browserbase.py verify

      - name: Recover any already-completed current reports before submitting
        working-directory: tooling
        shell: bash
        run: |
          set +e
          python scripts/pangram_gui_browserbase.py recover \
            --input ../romance/work/romance-current-assembly/pangram-part-1.txt \
            --output-root state/gui-runs
          echo "Part 1 recovery status: $?"
          python scripts/pangram_gui_browserbase.py recover \
            --input ../romance/work/romance-current-assembly/pangram-part-2.txt \
            --output-root state/gui-runs
          echo "Part 2 recovery status: $?"
          exit 0

      - name: Submit only uncached exact halves
        working-directory: tooling
        shell: bash
        run: |
          set +e
          python scripts/pangram_gui_browserbase.py run \
            --input ../romance/work/romance-current-assembly/pangram-part-1.txt \
            --input ../romance/work/romance-current-assembly/pangram-part-2.txt \
            --output-root state/gui-runs \
            --report-timeout-ms 600000
          rc=$?
          echo "DETECTOR_EXIT=$rc" >> "$GITHUB_ENV"
          exit 0

      - name: Persist all Browserbase/Pangram evidence before exit
        if: always()
        working-directory: tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pangram GUI Browserbase Actions'
          git config user.email 'pangram-gui-browserbase-actions@users.noreply.github.com'
          git add state/gui-runs/pangram-4 || true
          if git diff --cached --quiet; then
            echo 'No new Browserbase evidence to commit.'
            exit 0
          fi
          changed=$(git diff --cached --name-only)
          if grep -Ev '^state/gui-runs/pangram-4/' <<<"$changed" >/dev/null; then
            echo 'Refusing to commit paths outside state/gui-runs/pangram-4/'
            printf '%s\n' "$changed"
            exit 2
          fi
          git commit -m 'evidence: Browserbase Pangram current Romance halves'
          git push origin HEAD:agent/pangram-browserbase-gui-automation-20260817

      - name: Propagate detector failure after evidence persistence
        if: always()
        shell: bash
        run: exit "${DETECTOR_EXIT:-99}"

  weekly-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Fetch long-lived evidence branch
        run: git fetch origin automation/pangram-fixed-batch:refs/remotes/origin/automation/pangram-fixed-batch || true
      - name: Audit lesson integrity
        id: audit
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m pangram_lab.lesson_closeout audit --ref HEAD --json-out audit-main.json
          s1=$?
          if git show-ref --verify --quiet refs/remotes/origin/automation/pangram-fixed-batch; then
            PYTHONPATH=src python -m pangram_lab.lesson_closeout audit --ref origin/automation/pangram-fixed-batch --json-out audit-automation.json
            s2=$?
          else
            printf '{"ok":true,"note":"automation branch not found"}\n' > audit-automation.json
            s2=0
          fi
          cat audit-main.json audit-automation.json > lesson-audit-report.txt
          if [[ $s1 -ne 0 || $s2 -ne 0 ]]; then
            echo "orphans=true" >> "$GITHUB_OUTPUT"
          else
            echo "orphans=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Open or update orphan issue
        if: steps.audit.outputs.orphans == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title='Lesson integrity audit: unresolved findings'
          body_file=lesson-audit-report.txt
          number=$(gh issue list --state open --search '"Lesson integrity audit: unresolved findings" in:title' --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi
          exit 1
      - name: Close resolved orphan issue
        if: steps.audit.outputs.orphans == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          number=$(gh issue list --state open --search '"Lesson integrity audit: unresolved findings" in:title' --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body 'Weekly lesson-integrity audit is clean; closing.'
            gh issue close "$number"
          fi
