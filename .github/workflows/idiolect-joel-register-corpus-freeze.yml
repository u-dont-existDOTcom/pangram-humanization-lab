name: Idiolect Joel register corpus freeze

on:
  pull_request:
    paths:
      - .github/workflows/idiolect-joel-register-corpus-freeze.yml
      - state/IDIOLECT-JOEL-REGISTER-CORPUS-SPEC-2026-08-18.json
      - state/IDIOLECT-LEGACY-TRIAGE-QUEUE-2026-08-18.json
      - src/pangram_lab/joel_register_corpus.py
      - src/pangram_lab/joel_legacy_profile.py
      - src/pangram_lab/corpus_acquire.py
      - tests/test_joel_register_corpus.py
  push:
    branches: [main]
    paths:
      - .github/workflows/idiolect-joel-register-corpus-freeze.yml
      - state/IDIOLECT-JOEL-REGISTER-CORPUS-SPEC-2026-08-18.json
      - state/IDIOLECT-LEGACY-TRIAGE-QUEUE-2026-08-18.json
      - src/pangram_lab/joel_register_corpus.py
      - src/pangram_lab/joel_legacy_profile.py
      - src/pangram_lab/corpus_acquire.py
      - tests/test_joel_register_corpus.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install package and run focused tests
        run: |
          python -m pip install -q -e '.[test]'
          python -m pytest -q \
            tests/test_joel_register_corpus.py \
            tests/test_joel_legacy_profile.py \
            tests/test_corpus_acquire.py

      - name: Build register-labeled Joel corpus candidate
        run: |
          python -m pangram_lab.joel_register_corpus \
            state/IDIOLECT-JOEL-REGISTER-CORPUS-SPEC-2026-08-18.json \
            --out-dir .local/idiolect-corpus/joel-register-corpus \
            --receipt-out .local/idiolect-corpus/joel-register-corpus-receipt.json

      - name: Enforce source-balance, audit, and privacy boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.local/idiolect-corpus/joel-register-corpus-receipt.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['raw_or_canonical_prose_in_output'] is False
          assert data['corpus_status'] == 'candidate-frozen-not-benchmark-eligible'
          assert data['document_count'] == 9
          assert data['pending_manual_audit_count'] == 4
          assert data['exact_duplicate_groups'] == []
          assert data['benchmark_eligible'] is False
          assert len(data['full_cleaned_hash_set_sha256']) == 64

          views = {row['view_id']: row for row in data['views']}
          assert set(views) == {
              'conservative-philosophical-full',
              'post-audit-pooled-full',
              'post-audit-pooled-max-500',
              'post-audit-pooled-equal-180',
              'political-journalistic-full',
          }

          full = views['post-audit-pooled-full']
          assert full['source_count'] == 9
          assert full['site_group_count'] == 2
          assert full['pending_manual_audit_count'] == 4
          assert full['largest_source_fraction'] <= 0.30

          equal = views['post-audit-pooled-equal-180']
          assert equal['source_count'] == 9
          assert equal['total_words'] == 1620
          assert equal['all_sources_exact_budget'] is True
          assert equal['largest_source_words'] == 180
          assert equal['largest_source_fraction'] == 0.111111
          assert equal['site_group_count'] == 2
          assert equal['pending_manual_audit_count'] == 4
          assert len(equal['canonical_hash_set_sha256']) == 64

          encoded = json.dumps(data, ensure_ascii=False, sort_keys=True)
          for forbidden in ('local_text_path', 'raw_text', 'canonical_text'):
              assert forbidden not in encoded
          PY

      - name: Upload metadata-only register corpus receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idiolect-joel-register-corpus-metadata
          path: .local/idiolect-corpus/joel-register-corpus-receipt.json
          if-no-files-found: error
          retention-days: 30
