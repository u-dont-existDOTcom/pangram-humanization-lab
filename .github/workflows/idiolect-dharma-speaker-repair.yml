name: Idiolect Dharma speaker repair

on:
  pull_request:
    paths:
      - .github/workflows/idiolect-dharma-speaker-repair.yml
      - src/pangram_lab/dharma_speaker_acquire.py
      - tests/test_dharma_speaker_acquire.py
      - state/IDIOLECT-LEGACY-TRIAGE-QUEUE-2026-08-18.json
  push:
    branches: [main]
    paths:
      - .github/workflows/idiolect-dharma-speaker-repair.yml
      - src/pangram_lab/dharma_speaker_acquire.py
      - tests/test_dharma_speaker_acquire.py
      - state/IDIOLECT-LEGACY-TRIAGE-QUEUE-2026-08-18.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install package and run extraction tests
        run: |
          python -m pip install -q -e '.[test]'
          python -m pytest -q tests/test_dharma_speaker_acquire.py tests/test_corpus_acquire.py

      - name: Rerun reviewed Dharma speaker tranche
        run: |
          python -m pangram_lab.dharma_speaker_acquire \
            state/IDIOLECT-LEGACY-TRIAGE-QUEUE-2026-08-18.json \
            --manifest-out .local/idiolect-corpus/dharma-speaker-manifest.json

      - name: Require six nonzero Joel extractions and build metadata-only receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.local/idiolect-corpus/dharma-speaker-manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          rows = data.get('results', [])
          errors = data.get('errors', [])
          expected = 6
          if errors:
              raise SystemExit(f'Dharma extraction errors: {errors}')
          if len(rows) != expected:
              raise SystemExit(f'Expected {expected} Dharma extractions, got {len(rows)}')
          if any(int(row.get('word_count', 0)) <= 0 for row in rows):
              raise SystemExit('At least one Dharma extraction remained zero-word')
          if any(int(row.get('target_marker_count', 0)) <= 0 for row in rows):
              raise SystemExit('At least one Dharma extraction lacked an explicit target marker')

          receipt = {
              'schema_version': 1,
              'raw_or_canonical_prose_in_receipt': False,
              'sample_count': len(rows),
              'error_count': 0,
              'samples': [
                  {
                      'sample_id': row['sample_id'],
                      'canonical_sha256': row['canonical_sha256'],
                      'word_count': row['word_count'],
                      'target_marker_count': row['target_marker_count'],
                      'other_speaker_boundary_count': row['other_speaker_boundary_count'],
                      'standalone_boundary_count': row['standalone_boundary_count'],
                      'ambiguous_single_word_line_count': row['ambiguous_single_word_line_count'],
                      'quality_flags': row['quality_flags'],
                  }
                  for row in rows
              ],
          }
          out = Path('.local/idiolect-corpus/dharma-speaker-receipt.json')
          out.write_text(json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Upload metadata-only Dharma receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idiolect-dharma-speaker-repair-metadata
          path: .local/idiolect-corpus/dharma-speaker-receipt.json
          if-no-files-found: error
          retention-days: 30
