name: One-shot four-author LUAR target verification
# actions-cost-class: one-shot-public-research

on:
  pull_request:
    paths:
      - .github/workflows/idiolect-four-author-target-verification-one-shot.yml
      - state/IDIOLECT-FOUR-AUTHOR-TARGET-VERIFICATION-SPEC-2026-08-19.json
      - state/IDIOLECT-FOUR-AUTHOR-TARGET-VERIFICATION-DHARMA-QUEUE-2026-08-19.json
      - state/IDIOLECT-FOUR-AUTHOR-TARGET-VERIFICATION-TAFKA-QUEUE-2026-08-19.json
      - src/pangram_lab/luar_target_verification.py
      - tests/test_luar_target_verification.py

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

concurrency:
  group: idiolect-four-author-target-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install package and isolated CPU LUAR environment
        run: |
          python -m pip install -q -e '.[test]'
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu 'torch>=2.2,<3'
          python -m pip install -q \
            'transformers>=4.40,<5' \
            'einops>=0.7,<1' \
            'safetensors>=0.4,<1' \
            'scikit-learn>=1.3,<2'

      - name: Run target-verification and inherited LUAR regressions
        run: |
          python -m pytest -q \
            tests/test_luar_target_verification.py \
            tests/test_luar_matched_pilot.py \
            tests/test_dharma_control_candidate.py \
            tests/test_dharma_speaker_acquire.py \
            tests/test_surface_svm_equal_budget.py

      - name: Pace current Dharma source acquisition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pangram_lab.dharma_control_candidate import paced_acquire_candidate

          result = paced_acquire_candidate(
              Path('state/IDIOLECT-FOUR-AUTHOR-TARGET-VERIFICATION-DHARMA-QUEUE-2026-08-19.json'),
              out_dir=Path('.local/idiolect-corpus/four-author-target/dharma-text'),
              manifest_dir=Path('.local/idiolect-corpus/four-author-target/dharma-sample-manifests'),
              spacing_seconds=8,
              timeout=30,
          )
          out = Path('.local/idiolect-corpus/four-author-target/dharma-manifest.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'request_count': result['request_count'],
              'network_fetch_count': result['network_fetch_count'],
              'sleep_count': result['sleep_count'],
              'result_count': len(result['results']),
              'error_count': len(result['errors']),
          }, indent=2, sort_keys=True))
          if result['errors']:
              raise SystemExit(result['errors'])
          PY

      - name: Briefly space Blogger source families
        run: sleep 12

      - name: Pace independent TAFKA source acquisition
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from pangram_lab.corpus_acquire import acquire_inventory, iter_inventory_items

          inventory = Path('state/IDIOLECT-FOUR-AUTHOR-TARGET-VERIFICATION-TAFKA-QUEUE-2026-08-19.json')
          data = json.loads(inventory.read_text(encoding='utf-8'))
          ids = [str(row['sample_id']) for row in iter_inventory_items(data)]
          results = []
          errors = []
          for index, sample_id in enumerate(ids):
              if index:
                  time.sleep(8)
              runtime = acquire_inventory(
                  inventory,
                  out_dir=Path('.local/idiolect-corpus/four-author-target/tafka-text') / sample_id,
                  manifest_out=Path('.local/idiolect-corpus/four-author-target/tafka-sample-manifests') / f'{sample_id}.json',
                  sample_ids={sample_id},
                  timeout=30,
              )
              results.extend(runtime.get('results', []))
              errors.extend(runtime.get('errors', []))
          manifest = {
              'schema_version': 1,
              'raw_or_canonical_prose_in_output': False,
              'request_count': len(ids),
              'spacing_seconds': 8,
              'results': results,
              'errors': errors,
          }
          out = Path('.local/idiolect-corpus/four-author-target/tafka-manifest.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'request_count': len(ids), 'result_count': len(results), 'error_count': len(errors)}, indent=2))
          if errors:
              raise SystemExit(errors)
          PY

      - name: Run pinned four-author exact-50 target verification
        run: |
          python -m pangram_lab.luar_target_verification \
            state/IDIOLECT-FOUR-AUTHOR-TARGET-VERIFICATION-SPEC-2026-08-19.json \
            --dharma-manifest .local/idiolect-corpus/four-author-target/dharma-manifest.json \
            --tafka-manifest .local/idiolect-corpus/four-author-target/tafka-manifest.json \
            --working-dir .local/idiolect-corpus/four-author-target/normalized \
            --out .local/idiolect-corpus/four-author-target/result.json

      - name: Upload metadata-only result before interpretation gates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idiolect-four-author-target-verification-metadata
          path: .local/idiolect-corpus/four-author-target/result.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce result identity, privacy, and stratum boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.local/idiolect-corpus/four-author-target/result.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['status'] == 'target-centric-four-author-exact50-verification-not-IER'
          assert data['raw_or_canonical_prose_in_output'] is False
          assert data['embeddings_persisted_in_output'] is False
          assert data['authors'] == [
              'Joel Rosenblum',
              'Stian Gudmundsen Høiland',
              'David Vardy',
              'Greg Goode',
          ]
          assert data['word_budget_per_document'] == 50
          assert data['profile_documents_per_author'] == 3
          assert data['strata']['matched_dharma']['fold_count'] == 4
          assert data['strata']['matched_dharma']['summary']['document_count'] == 4
          assert data['strata']['independent_tafka']['summary']['document_count'] == 2
          for author in ('Stian Gudmundsen Høiland', 'David Vardy', 'Greg Goode'):
              assert len(data['control_profile_selection'][author]['selected']) == 3
          model = data['model']
          assert model['model_id'] == 'rrivera1849/LUAR-MUD'
          assert model['requested_revision'] == 'e95c2b6e5b03e5e47f4a3e041afa9bde0a50b73d'
          assert model['upstream_transformer_revision'] == '48bffbbd27bf028ecdd0cd55abb51236ec12ef1b'
          assert model['embedding_size'] in (0, 512)
          assert data['interpretation_guardrails']['do_not_call_ier'] is True
          assert data['interpretation_guardrails']['do_not_average_strata'] is True

          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      assert key not in {
                          'text', 'raw_text', 'canonical_text', 'local_text_path',
                          'embedding', 'embeddings', 'vector', 'vectors'
                      }, key
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(data)
          PY

      - name: Verify no source prose became repository-visible
        run: |
          git restore --worktree -- src/pangram_humanization_lab.egg-info || true
          if git status --short --untracked-files=all | grep -v '^?? .local/' | grep -q .; then
            echo 'Target verification unexpectedly modified repository-visible files.' >&2
            git status --short --untracked-files=all >&2
            exit 1
          fi
          git check-ignore -q .local/idiolect-corpus/four-author-target/result.json
