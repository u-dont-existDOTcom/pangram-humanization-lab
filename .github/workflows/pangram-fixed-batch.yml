name: Evidence workflow compliance (TDD red)

on:
  push:
    branches:
      - codex/evidence-workflow-compliance-2026-08-14

permissions:
  contents: read

concurrency:
  group: evidence-compliance-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -q -e '.[test]'
      - name: Run paid-dispatch validator tests
        run: python -m pytest -q tests/test_paid_dispatch.py
