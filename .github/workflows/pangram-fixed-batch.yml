name: Pangram fixed batch

on:
  push:
    branches:
      - automation/pangram-fixed-batch
    paths:
      - '.github/workflows/pangram-fixed-batch.yml'
      - 'experiments/romance-authorial-recovery-r27-2026-08-14.json'
      - 'src/pangram_lab/fixed_batch.py'
      - 'src/pangram_lab/result_paths.py'
      - 'src/pangram_lab/call_budget.py'
      - 'src/pangram_lab/tracked_pangram.py'
      - 'scripts/run_fixed_batch.py'
      - 'tests/test_fixed_batch.py'
      - 'tests/test_result_paths.py'
      - 'tests/test_call_budget*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test fixed-batch path
        run: >-
          pytest -q
          tests/test_fixed_batch.py
          tests/test_result_paths.py
          tests/test_pangram.py
          tests/test_cache.py
          tests/test_git_sync.py
          tests/test_call_budget.py
          tests/test_call_budget_pangram.py
          tests/test_call_budget_fixed_batch.py

  detector:
    needs: test
    if: github.event_name == 'workflow_dispatch' || contains(toJson(github.event.head_commit.added), 'experiments/romance-authorial-recovery-r27-2026-08-14.json') || contains(toJson(github.event.head_commit.modified), 'experiments/romance-authorial-recovery-r27-2026-08-14.json')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Configure git checkpoint identity
        run: |
          git config user.name "Pangram Lab Actions"
          git config user.email "pangram-lab-actions@users.noreply.github.com"
      - name: Verify Pangram secret is configured
        env:
          PANGRAM_API_KEY: ${{ secrets.PANGRAM_API_KEY }}
        run: |
          test -n "$PANGRAM_API_KEY" || { echo "PANGRAM_API_KEY secret is missing"; exit 1; }
          echo "PANGRAM_API_KEY is configured"
      - name: Run authorial-recovery r27
        env:
          PANGRAM_API_KEY: ${{ secrets.PANGRAM_API_KEY }}
        run: python scripts/run_fixed_batch.py experiments/romance-authorial-recovery-r27-2026-08-14.json
