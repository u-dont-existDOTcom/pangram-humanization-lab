name: Pangram fixed batch

on:
  push:
    branches:
      - automation/pangram-fixed-batch
    paths:
      - '.github/workflows/pangram-fixed-batch.yml'
      - 'experiments/romance-checklist-pairs-r15-2026-08-13.json'
      - 'src/pangram_lab/fixed_batch.py'
      - 'scripts/run_fixed_batch.py'
      - 'tests/test_fixed_batch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test fixed-batch path
        run: pytest -q tests/test_fixed_batch.py tests/test_pangram.py tests/test_cache.py tests/test_git_sync.py
      - name: Configure git checkpoint identity
        run: |
          git config user.name "Pangram Lab Actions"
          git config user.email "pangram-lab-actions@users.noreply.github.com"
      - name: Verify Pangram secret is configured
        env:
          PANGRAM_API_KEY: ${{ secrets.PANGRAM_API_KEY }}
        run: |
          test -n "$PANGRAM_API_KEY" || { echo "PANGRAM_API_KEY secret is missing"; exit 1; }
          echo "PANGRAM_API_KEY is configured"
      - name: Run locally-human pair interaction matrix
        env:
          PANGRAM_API_KEY: ${{ secrets.PANGRAM_API_KEY }}
        run: |
          python scripts/run_fixed_batch.py \
            experiments/romance-checklist-pairs-r15-2026-08-13.json \
            --out state/experiments/romance-checklist-pairs-r15-2026-08-13-results.json
