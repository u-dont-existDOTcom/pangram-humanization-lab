name: Test Pangram exact-repeat guard

on:
  push:
    branches:
      - automation/pangram-fixed-batch
    paths:
      - 'src/pangram_lab/tracked_pangram.py'
      - 'src/pangram_lab/fixed_batch.py'
      - 'tests/test_tracked_pangram_repeat_guard.py'
      - '.github/workflows/test-exact-repeat-guard.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: automation/pangram-fixed-batch
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -q -e '.[test]'
      - run: python -m pytest -q tests/test_tracked_pangram_repeat_guard.py tests/test_fixed_batch.py tests/test_call_budget.py
