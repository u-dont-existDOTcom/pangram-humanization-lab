name: Idiolect Dharma author census
# actions-cost-class: manual-heavy-research

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idiolect-source-network-${{ github.ref }}
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install package and run census tests
        run: |
          python -m pip install -q -e '.[test]'
          python -m pytest -q tests/test_dharma_author_discover.py

      - name: Census pre-LLM Dharma Connection target threads and co-speakers
        run: |
          python -m pangram_lab.dharma_author_discover \
            --blog https://dharmaconnectiongroup.blogspot.com/ \
            --target-speaker 'Joel Rosenblum' \
            --out .local/idiolect-corpus/dharma-author-census.json

      - name: Build compact metadata-only receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('.local/idiolect-corpus/dharma-author-census.json').read_text(encoding='utf-8'))
          candidates = [
              row for row in data.get('control_speaker_candidates', [])
              if int(row.get('thread_count', 0)) >= 2
          ]
          receipt = {
              'schema_version': 1,
              'raw_or_canonical_prose_in_receipt': False,
              'target_speaker': data.get('target_speaker'),
              'feed_page_count': len(data.get('feed_pages', [])),
              'target_post_count': data.get('target_post_count', 0),
              'target_posts': [
                  {
                      'entry_id': row.get('entry_id'),
                      'title': row.get('title'),
                      'published': row.get('published'),
                      'url': row.get('url'),
                      'raw_target_occurrences': row.get('raw_target_occurrences'),
                      'target_label_count': row.get('target_label_count'),
                      'explicit_speaker_labels': row.get('explicit_speaker_labels', []),
                  }
                  for row in data.get('target_posts', [])
              ],
              'recurring_control_candidates_min_2_threads': candidates,
          }
          out = Path('.local/idiolect-corpus/dharma-author-census-receipt.json')
          out.write_text(json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Upload metadata-only census receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idiolect-dharma-author-census-metadata
          path: .local/idiolect-corpus/dharma-author-census-receipt.json
          if-no-files-found: error
          retention-days: 30
