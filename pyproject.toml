[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pangram-humanization-lab"
version = "2.0.1"
description = "Adaptive, resumable Pangram 4 experiment lab for Joel humanization research"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
browser = ["playwright>=1.50"]

[project.scripts]
pangram-lab = "pangram_lab.cli:main"
pangram-lesson-closeout = "pangram_lab.lesson_closeout:main"
pangram-local = "pangram_lab.local_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
